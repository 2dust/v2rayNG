name: Fix submodules (run once, then delete this file)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (without submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register submodules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in hev-socks5-tunnel AndroidLibXrayLite aether; do
            git rm -rf --cached -q "$p" 2>/dev/null || true
            rm -rf "$p"
          done
          git submodule add --force https://github.com/heiher/hev-socks5-tunnel hev-socks5-tunnel
          git submodule add --force https://github.com/patterniha/AndroidLibXrayLite AndroidLibXrayLite
          git submodule add --force -b main https://github.com/patterniha/Aether.git aether
          git add .gitmodules hev-socks5-tunnel AndroidLibXrayLite aether
          git commit -m "Register submodules"
          git push origin HEAD:${{ github.ref_name }}
