name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUST_TOOLCHAIN: "1.99.0"
      GO_VERSION: "1.26"
      HAS_KEYSTORE: ${{ secrets.APP_KEYSTORE_BASE64 != '' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Init nested submodules
      run: |
        echo "=== Initializing hev-socks5-tunnel nested submodules ==="
        cd hev-socks5-tunnel
        git submodule update --init --recursive
        cd ..
        echo "=== hev-socks5-tunnel root ==="
        ls -la hev-socks5-tunnel/
        echo "=== third-part contents ==="
        ls -la hev-socks5-tunnel/third-part/ 2>/dev/null || echo "third-part folder not found"
        echo "=== Done ==="

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Restore cached libaether
      id: cache-libaether-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-aether
        key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

    - name: Build libaether
      if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-aether.sh

    - name: Save libaether
      if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-aether
        key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: Restore cached Psiphon client
      id: cache-psiphon-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/psiphon-build.sh') }}-${{ hashFiles('compile-psiphon.sh') }}

    - name: Build the Psiphon client
      if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-psiphon.sh

    - name: Save the Psiphon client
      if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/psiphon-build.sh') }}-${{ hashFiles('compile-psiphon.sh') }}

    - name: Restore cached pluggable transport
      id: cache-pt-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/pt-build.sh') }}-${{ hashFiles('compile-pt.sh') }}

    - name: Build the pluggable transport
      if: steps.cache-pt-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-pt.sh

    - name: Save the pluggable transport
      if: steps.cache-pt-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/pt-build.sh') }}-${{ hashFiles('compile-pt.sh') }}

    - name: Stage the native libraries
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app
        cp -r ${{ github.workspace }}/libs-aether/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-psiphon/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-pt/. ${{ github.workspace }}/V2rayNG/app/libs/

    - name: Fetch the Psiphon server list
      run: |
        bash fetch-psiphon-servers.sh

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: 'patterniha/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      if: env.HAS_KEYSTORE == 'true'
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:testPlaystoreDebugUnitTest
        ./gradlew licenseFdroidReleaseReport
        if [ "$HAS_KEYSTORE" = "true" ]; then
          ./gradlew assembleRelease -PpattngVersion="${{ inputs.release_tag }}" \
            -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} \
            -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}
        else
          ./gradlew assembleDebug -PpattngVersion="${{ inputs.release_tag }}"
        fi
    
    - name: Check the native libraries in the APKs
      run: |
        status=0
        for apk in ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/*/*.apk; do
          entries=$(unzip -Z1 "$apk" | grep '^lib/' || true)
          echo "$(basename "$apk"):"
          echo "$entries" | sed 's/^/  /'
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "$entries" | grep -q "^lib/$abi/" || continue
            for lib in libaether.so libpsiphon-tunnel-core.so liblyrebird.so; do
              if ! echo "$entries" | grep -qx "lib/$abi/$lib"; then
                echo "::error::$(basename "$apk") lacks lib/$abi/$lib"
                status=1
              fi
            done
          done
        done
        exit $status

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/*/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/*/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/*/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/*/*universal*.apk

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --quiet --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f -name '*.apk' | while read apk; do
            cp "$apk" release-files/
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

          gpg --armor --export "$KEY" > release-files/Matixray-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          release_name: Matixray v${{ inputs.release_tag }}
          body: "."
          target_commit: ${{ github.sha }}
          file_glob: true
          prerelease: true
          overwrite: true
