name: Build and Release behradNG

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '.github/workflows/release-metadata.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.3.11)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
      APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
      APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Restore persistent release signing key
      shell: bash
      env:
        APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
      run: |
        for SECRET_NAME in APP_KEYSTORE_BASE64 APP_KEYSTORE_PASSWORD APP_KEYSTORE_ALIAS APP_KEY_PASSWORD; do
          if [ -z "${!SECRET_NAME}" ]; then
            echo "::error::Missing repository Actions secret: $SECRET_NAME"
            exit 1
          fi
        done
        SIGNING_FILE="$RUNNER_TEMP/behradNG-release.jks"
        printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_FILE"
        echo "BNG_SIGNING_KEYSTORE=$SIGNING_FILE" >> "$GITHUB_ENV"

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false
        packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools ndk;29.0.14206865 ndk;30.0.16248370'

    - name: Resolve Android 37 SDK path
      shell: bash
      run: |
        # API 37 is published as android-37.0, but compileSdk = 37 resolves android-37.
        # Remove this alias once sdkmanager installs platforms;android-37 directly.
        if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
          ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
        fi
        test -r "$ANDROID_HOME/platforms/android-37/android.jar"

    - name: Restore missing Gradle wrapper
      shell: bash
      run: |
        if [ ! -f V2rayNG/gradle/wrapper/gradle-wrapper.jar ]; then
          GRADLE_VERSION=$(sed -n 's/.*gradle-\([0-9.]*\)-bin.zip/\1/p' V2rayNG/gradle/wrapper/gradle-wrapper.properties)
          test -n "$GRADLE_VERSION"
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/gradle/gradle/v$GRADLE_VERSION/gradle/wrapper/gradle-wrapper.jar" -o V2rayNG/gradle/wrapper/gradle-wrapper.jar
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Determine Release Tag
      id: tag_step
      run: |
        if [ -n "${{ inputs.release_tag }}" ]; then
          TAG="${{ inputs.release_tag }}"
        elif [ "${{ github.ref_type }}" = "tag" ]; then
          TAG="${{ github.ref_name }}"
        else
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$VERSION_NAME"
          TAG="v$VERSION_NAME"
        fi
        echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
        echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
        echo "Release tag will be: $TAG"

    - name: Setup Go for pinned Xray source
      uses: actions/setup-go@v6
      with:
        go-version-file: AndroidLibXrayLite/go.mod
        cache-dependency-path: AndroidLibXrayLite/go.sum

    - name: Build pinned Xray AAR
      working-directory: AndroidLibXrayLite
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
      run: |
        go mod download
        MOBILE_VERSION=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
        go install "golang.org/x/mobile/cmd/gomobile@$MOBILE_VERSION" "golang.org/x/mobile/cmd/gobind@$MOBILE_VERSION"
        mkdir -p assets data "$GITHUB_WORKSPACE/app/libs"
        bash gen_assets.sh download
        cp data/*.dat assets/
        gomobile init
        gomobile bind -v -target=android -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o "$GITHUB_WORKSPACE/app/libs/libv2ray.aar" ./
        for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
          unzip -l "$GITHUB_WORKSPACE/app/libs/libv2ray.aar" "jni/$ABI/libgojni.so" | grep -F "jni/$ABI/libgojni.so"
        done

    - name: Build pinned HEV libraries
      env:
        NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
      run: |
        bash compile-hevtun.sh
        cp -a libs/. app/libs/
        for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
          test -s "app/libs/$ABI/libhev-socks5-tunnel.so"
          test -s "app/libs/$ABI/libhevsockstun.so"
        done

    - name: Prepare behradNG project
      shell: bash
      run: |
        # The complete Gradle project is in V2rayNG; app contains the fork's overrides.
        cp -a app/. V2rayNG/app/
        if [ ! -f V2rayNG/debug.keystore ]; then
          keytool -genkeypair -keystore V2rayNG/debug.keystore -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
        fi

    - name: Build APK with Gradle
      working-directory: V2rayNG
      run: |
        chmod +x gradlew
        ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin :app:assembleRelease --stacktrace

    - name: Verify installable release APK
      shell: bash
      run: |
        APK_FILE=$(find V2rayNG/app/build/outputs/apk -name "*.apk" | head -n 1)
        test -n "$APK_FILE"
        "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --min-sdk-version 24 "$APK_FILE"
        "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_FILE" | grep -F "package: name='com.v2ray.ang.behradng'"

    - name: Verify APK native libraries
      shell: bash
      run: |
        APK_FILE=$(find V2rayNG/app/build/outputs/apk -name "*.apk" | head -n 1)
        test -n "$APK_FILE"
        for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
          for LIBRARY in libhev-socks5-tunnel.so libhevsockstun.so libgojni.so; do
            unzip -l "$APK_FILE" "lib/$ABI/$LIBRARY" | grep -F "lib/$ABI/$LIBRARY"
          done
        done

    - name: Prepare Release APK Artifact
      run: |
        mkdir -p release-apks
        APK_FILE=$(find V2rayNG/app/build/outputs/apk -name "*.apk" | head -n 1)
        if [ -f "$APK_FILE" ]; then
          cp "$APK_FILE" "release-apks/behradNG-${{ env.RELEASE_TAG }}.apk"
        else
          echo "No APK found in app/build/outputs/apk!"
          exit 1
        fi
        ls -la release-apks/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: behradNG-${{ env.RELEASE_TAG }}
        path: release-apks/*.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "behradNG ${{ env.RELEASE_TAG }}"
        body: |
          # 🚀 behradNG ${{ env.RELEASE_TAG }}

          Fast & Secure V2Ray / Xray client for Android with an **ExpressVPN-inspired** interface.

          ### ✨ Key Features
          - 🎨 **ExpressVPN-Style Design**: Giant power button with glowing connected pulse aura, dynamic status banners, and location selector card.
          - ⚙️ **Custom Configuration Management**: Easily add and import configs (VLESS, VMess, Shadowsocks, Trojan, WireGuard, Hysteria2, SOCKS, HTTP).
          - ⚡ **Real Ping & Speed Test**: One-tap latency test for all nodes or current server.
          - 🛡️ **Advanced Security**: Split tunneling (Per-App Proxy), Routing rules (Bypass LAN / Global), and Custom DNS.

          ### 📥 Download
          Download the attached `behradNG-${{ env.RELEASE_TAG }}.apk` below and install it directly on your Android device (Android 7.0+).

          ---
          *Automated Release from commit: ${{ github.sha }}*
        files: |
          release-apks/*.apk
        draft: false
        prerelease: false
        make_latest: 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
