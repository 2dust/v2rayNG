name: Build and Release behradNG

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.3.11)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false
        packages: 'platforms;android-37 build-tools;36.0.0 platform-tools'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Determine Release Tag
      id: tag_step
      run: |
        if [ -n "${{ inputs.release_tag }}" ]; then
          TAG="${{ inputs.release_tag }}"
        elif [ "${{ github.ref_type }}" = "tag" ]; then
          TAG="${{ github.ref_name }}"
        else
          TAG="v2.3.11-build.${{ github.run_number }}"
        fi
        echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
        echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
        echo "Release tag will be: $TAG"

    - name: Download libv2ray AAR if needed
      run: |
        mkdir -p app/libs
        if [ ! -f "app/libs/libv2ray.aar" ]; then
          echo "Downloading libv2ray.aar..."
          curl -sL https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.10/libv2ray.aar -o app/libs/libv2ray.aar
        fi

    - name: Extract native libraries if needed
      run: |
        if [ ! -d "app/libs/arm64-v8a" ] || [ ! -f "app/libs/arm64-v8a/libhev-socks5-tunnel.so" ]; then
          echo "Extracting native hev libraries..."
          mkdir -p /tmp/apk_libs app/libs/arm64-v8a app/libs/x86_64 app/libs/armeabi-v7a app/libs/x86
          curl -sL https://github.com/2dust/v2rayNG/releases/download/2.2.6/v2rayNG_2.2.6_arm64-v8a.apk -o /tmp/arm64.apk
          curl -sL https://github.com/2dust/v2rayNG/releases/download/2.2.6/v2rayNG_2.2.6_x86_64.apk -o /tmp/x86_64.apk
          curl -sL https://github.com/2dust/v2rayNG/releases/download/2.2.6/v2rayNG_2.2.6_armeabi-v7a.apk -o /tmp/armv7.apk
          curl -sL https://github.com/2dust/v2rayNG/releases/download/2.2.6/v2rayNG_2.2.6_x86.apk -o /tmp/x86.apk
          unzip -q /tmp/arm64.apk "lib/*" -d /tmp/apk_libs/
          unzip -q /tmp/x86_64.apk "lib/*" -d /tmp/apk_libs/
          unzip -q /tmp/armv7.apk "lib/*" -d /tmp/apk_libs/
          unzip -q /tmp/x86.apk "lib/*" -d /tmp/apk_libs/
          cp -r /tmp/apk_libs/lib/arm64-v8a/libhev* app/libs/arm64-v8a/ 2>/dev/null || true
          cp -r /tmp/apk_libs/lib/x86_64/libhev* app/libs/x86_64/ 2>/dev/null || true
          cp -r /tmp/apk_libs/lib/armeabi-v7a/libhev* app/libs/armeabi-v7a/ 2>/dev/null || true
          cp -r /tmp/apk_libs/lib/x86/libhev* app/libs/x86/ 2>/dev/null || true
        fi

    - name: Build APK with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Prepare Release APK Artifact
      run: |
        mkdir -p release-apks
        APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        if [ -f "$APK_FILE" ]; then
          cp "$APK_FILE" "release-apks/behradNG-${{ env.RELEASE_TAG }}.apk"
        else
          echo "No APK found in app/build/outputs/apk!"
          exit 1
        fi
        ls -la release-apks/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: behradNG-${{ env.RELEASE_TAG }}
        path: release-apks/*.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "behradNG ${{ env.RELEASE_TAG }}"
        body: |
          # 🚀 behradNG ${{ env.RELEASE_TAG }}

          Fast & Secure V2Ray / Xray client for Android with an **ExpressVPN-inspired** interface.

          ### ✨ Key Features
          - 🎨 **ExpressVPN-Style Design**: Giant power button with glowing connected pulse aura, dynamic status banners, and location selector card.
          - ⚙️ **Custom Configuration Management**: Easily add and import configs (VLESS, VMess, Shadowsocks, Trojan, WireGuard, Hysteria2, SOCKS, HTTP).
          - ⚡ **Real Ping & Speed Test**: One-tap latency test for all nodes or current server.
          - 🛡️ **Advanced Security**: Split tunneling (Per-App Proxy), Routing rules (Bypass LAN / Global), and Custom DNS.

          ### 📥 Download
          Download the attached `behradNG-${{ env.RELEASE_TAG }}.apk` below and install it directly on your Android device (Android 7.0+).

          ---
          *Automated Release from commit: ${{ github.sha }}*
        files: |
          release-apks/*.apk
        draft: false
        prerelease: ${{ !startsWith(env.RELEASE_TAG, 'v') || contains(env.RELEASE_TAG, 'build') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
