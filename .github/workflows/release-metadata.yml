name: Promote release

on:
  push:
    branches: [master]
    paths: [.github/workflows/release-metadata.yml]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Publish as the latest normal release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || '1.0.0' }}
        run: |
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=false -f make_latest=true --jq '{tag: .tag_name, prerelease: .prerelease, url: .html_url}'
