name: Gozar Connection Fix - Native Bridge
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Require correct branch
        run: test "$GITHUB_REF_NAME" = "feature/gozar-webview-integration"
      - name: Repair Gozar native connection handoff
        run: python3 .github/scripts/gozar_connection_fix.py
      - name: Verify patch
        run: |
          git diff --check
          git diff --stat
          grep -q 'fun connectionError()' V2rayNG/app/src/main/java/com/gozar/vpn/ui/main/MainActivity.kt
          grep -q 'const res=B.startVpn(nativeInput);' V2rayNG/app/src/main/assets/index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V2rayNG/app/src/main/java/com/gozar/vpn/ui/main/MainActivity.kt V2rayNG/app/src/main/assets/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Gozar native VPN configuration handoff and error display'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
