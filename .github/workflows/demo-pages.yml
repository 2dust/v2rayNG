name: Demo preview page

# Publishes the static splash-animation demo in /demo to GitHub Pages.
# It is intentionally isolated from the Android build workflows.
on:
  # Manual only: GitHub Pages must be enabled once in repo Settings first
  # (Settings -> Pages -> Deploy from a branch -> arena/86ebebd3-rx-client -> /demo),
  # or run this workflow after granting the integration Pages admin access.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
