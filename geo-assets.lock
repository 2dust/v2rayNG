# Pinned geo databases embedded in libv2ray.aar.
#
# AndroidLibXrayLite/gen_assets.sh fetches these from `releases/latest`, which
# floats: two builds of the same commit on different days embed different data
# and cannot be reproduced against each other. That breaks any rebuilder
# verifying a published APK, so .github/workflows/fdroid-source-build.yml reads
# this file instead and refuses to continue if a download does not match the
# checksum recorded here.
#
# To update: pick a newer dated tag from each project's releases, copy the
# matching *.dat.sha256sum values below, and let CI verify them. Do it as its
# own commit so the data change is visible in history, and expect the APK
# checksums to change with it.
#
# Last updated: 2026-09-10

# https://github.com/Loyalsoldier/v2ray-rules-dat/releases
RULES_DAT_TAG='202609092346'
GEOIP_DAT_SHA256='4149e607530f91da697bad4696f8c59f0a475af38e69405e4124438c9886c721'
GEOSITE_DAT_SHA256='5193ed098d950b91ebfe7d40b91b298e5ac9f0f69aa2698c757bee2aceee8c29'

# https://github.com/Loyalsoldier/geoip/releases
GEOIP_REPO_TAG='202609100029'
GEOIP_ONLY_CN_PRIVATE_DAT_SHA256='a0d2a77fe4e2b5f4353c990d356ccd3dc5d7af14417f2c3aededac4f2dc9ec82'
