<script>
/* پل اندروید — اتصال واقعی و نمایش صریح وضعیت */
(function(){
  const B=window.GozarAndroid;
  if(!B) return;
  const tbSub=document.getElementById('tbSub');
  if(tbSub) tbSub.textContent=(typeof t==='function')?t('tb_sub_android'):'Android · Xray';
  let vpnOn=false, lastStartAt=0, lastError='', errorShown=false;
  function pushParams(){
    try{ if(B.setVpnParams) B.setVpnParams((typeof vpnOut==='function')?vpnOut():'{}'); }catch(e){}
  }
  function showError(msg){
    msg=String(msg||'راه‌اندازی VPN ناموفق بود.');
    session.reason=msg; setMode('err'); stopPulseLoop(); setProgress(0);
    if(msg!==lastError || !errorShown){ toast(msg,'err'); lastError=msg; errorShown=true; }
  }
  function setVpn(on){
    if(on===vpnOn && session.mode===(on?'on':'idle')) return;
    vpnOn=on;
    if(on){
      lastError=''; errorShown=false; session.pingMs=null; session.history=[];
      setMode('on'); setProgress(1); startPulseLoop(2600); renderMetrics(); drawSpark();
      document.getElementById('connCard').classList.add('on');
      const h=document.getElementById('hintTxt');
      if(h&&typeof t==='function') h.innerHTML=t('hint_android');
      log(typeof t==='function'?t('m_von'):'VPN tunnel active','ok');
    }else{
      document.getElementById('connCard').classList.remove('on');
      if(session.mode==='on'||session.mode==='busy') disconnect();
    }
  }
  function pollStatus(){
    let status='off';
    try{ status=B.vpnStatus(); }catch(e){ return; }
    if(status==='on'){ setVpn(true); return; }
    if(status==='connecting'){
      vpnOn=false;
      if(session.mode!=='busy') setMode('busy');
      session.reason='در حال راه‌اندازی هستهٔ VPN…'; renderCore(); renderChrome();
      return;
    }
    if(status==='error'){
      vpnOn=false;
      let msg='خطا در راه‌اندازی VPN';
      try{ if(B.coreLog) msg=B.coreLog()||msg; }catch(e){}
      showError(msg); return;
    }
    if(status==='off' && session.mode==='busy' && Date.now()-lastStartAt>7000){
      vpnOn=false; session.reason='اتصال شروع نشد؛ کانفیگ را بررسی و دوباره تلاش کن.';
      setMode('err'); stopPulseLoop(); setProgress(0);
    }else if(status==='off' && vpnOn){ setVpn(false); }
  }
  setInterval(pollStatus,700);
  document.addEventListener('click',function(e){
    const el=e.target.closest('[data-conn]');
    if(!el||el.id==='shConnect2') return;
    e.stopImmediatePropagation(); e.preventDefault();
    if(session.mode==='busy') return;
    if(vpnOn){ try{ B.stopVpn(); toast('در حال قطع اتصال…'); }catch(err){ showError('قطع اتصال ناموفق بود: '+err.message); } return; }
    const c=activeCfg();
    if(!c){ toast('هنوز سروری اضافه نشده؛ از «افزودن کانفیگ» لینک یا اشتراک معتبر وارد کن.','warn'); return; }
    const json=xrayOut(c);
    if(!json){ toast('این پروتکل در نسخهٔ فعلی پشتیبانی نمی‌شود؛ VLESS، VMess، Trojan یا Shadowsocks را انتخاب کن.','warn'); return; }
    lastStartAt=Date.now(); lastError=''; errorShown=false;
    session.reason='در حال درخواست مجوز و راه‌اندازی VPN…'; setMode('busy'); setProgress(0.15); startPulseLoop(900);
    pushParams();
    try{
      const res=B.startVpn(json);
      if(res==='ask') toast('در پنجرهٔ اندروید، اجازهٔ اتصال VPN را تأیید کن.','warn');
      else if(res==='invalid'){ showError('کانفیگ خالی یا نامعتبر است.'); }
      else if(res==='not_ready'){ showError('هستهٔ VPN آماده نیست.'); }
      else toast('درخواست اتصال ارسال شد؛ وضعیت در حال بررسی است.');
    }catch(err){ showError('ارسال درخواست اتصال ناموفق بود: '+(err&&err.message?err.message:String(err))); }
  },true);
  setTimeout(function(){
    try{
      if(typeof settings!=='undefined'&&settings.core&&settings.core.autoConn&&B.vpnStatus()!=='on'){
        const c=activeCfg(), json=c&&xrayOut(c);
        if(json){ lastStartAt=Date.now(); setMode('busy'); pushParams(); B.startVpn(json); }
      }
    }catch(e){ showError('اتصال خودکار ناموفق بود.'); }
  },1500);
})();
</script>

<script>
/* Gozar WebView fallback for top-bar popups and drawer. */
(function(){
  'use strict';
  function id(s){ return document.getElementById(s); }
  function closePops(){
    document.querySelectorAll('.pop.open').forEach(function(p){ p.classList.remove('open'); });
  }
  function closeDrawer(){
    var d=id('drawer'), s=id('scrim');
    if(d) d.classList.remove('open');
    if(s) s.classList.remove('open');
    document.body.classList.remove('locked');
  }
  function openPop(pop, btn){
    if(!pop || !btn) return;
    var wasOpen=pop.classList.contains('open');
    closePops(); closeDrawer();
    if(wasOpen) return;

    // Let the menu measure its full content before limiting it to the viewport.
    pop.style.maxHeight='none';
    pop.style.visibility='hidden';
    pop.style.left='8px'; pop.style.top='8px';
    pop.classList.add('open');

    var r=btn.getBoundingClientRect();
    var vw=document.documentElement.clientWidth || window.innerWidth;
    var vh=document.documentElement.clientHeight || window.innerHeight;
    var gap=8, anchorGap=6;
    var w=pop.offsetWidth || 280;
    var left=Math.max(gap, Math.min(r.left, vw-w-gap));
    pop.style.left=left+'px';

    var fullHeight=pop.scrollHeight || pop.offsetHeight || 320;
    var maxViewportHeight=Math.max(1, vh-gap*2);
    var desired=Math.min(fullHeight, maxViewportHeight);
    var below=Math.max(0, vh-r.bottom-anchorGap-gap);
    var above=Math.max(0, r.top-anchorGap-gap);
    var top, maxH;

    if(desired <= below){
      top=r.bottom+anchorGap;
      maxH=Math.min(desired, vh-top-gap);
    }else if(desired <= above){
      maxH=desired;
      top=r.top-anchorGap-maxH;
    }else if(below >= above){
      // If neither side fits, use the largest available area and keep it scrollable.
      top=Math.max(gap, Math.min(r.bottom+anchorGap, vh-gap-Math.min(desired, maxViewportHeight)));
      maxH=Math.min(desired, vh-top-gap);
    }else{
      maxH=Math.min(desired, maxViewportHeight);
      top=gap;
    }

    maxH=Math.max(1, Math.min(maxH, vh-gap*2));
    top=Math.max(gap, Math.min(top, vh-gap-maxH));
    pop.style.maxHeight=maxH+'px';
    pop.style.top=top+'px';
    pop.scrollTop=0;
    pop.style.visibility='';
  }
  function toggleDrawer(){
    var d=id('drawer'), s=id('scrim');
    if(!d || !s) return;
    var opening=!d.classList.contains('open');
    closePops();
    d.classList.toggle('open',opening);
    s.classList.toggle('open',opening);
    document.body.classList.toggle('locked',opening);
  }
  document.addEventListener('click',function(e){
    var t=e.target;
    if(!t || !t.closest) return;
    var drawerBtn=t.closest('#btnDrawer');
    if(drawerBtn){ e.preventDefault(); e.stopImmediatePropagation(); toggleDrawer(); return; }
    if(t.closest('#scrim')){ e.preventDefault(); e.stopImmediatePropagation(); closeDrawer(); return; }
    var popBtn=t.closest('[data-pop]');
    if(popBtn){
      e.preventDefault(); e.stopImmediatePropagation();
      var pop=null;
      try{ pop=document.querySelector(popBtn.getAttribute('data-pop')); }catch(err){}
      openPop(pop,popBtn); return;
    }
    if(!t.closest('.pop')) closePops();
  },true);
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ closePops(); closeDrawer(); }
  });
})();
</script>
