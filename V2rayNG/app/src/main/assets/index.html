<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0f0d">
<meta name="mobile-web-app-capable" content="yes">
<title>گذر — فایل کانفیگ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/index.min.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{--bg:#0a0f0d;--panel:#0f1714;--panel2:#121c18;--inset:#0c1310;--line:#1c2b25;--line2:#2a4238;--txt:#dfeae4;--sub:#8aa296;--faint:#5c7268;--acc:#2fe6a8;--acc-dark:#0d3a2b;--warn:#f0b45a;--err:#ff7369;--ok:#4be3a5;--mono:'JetBrains Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overscroll-behavior:none}
  body{background:var(--bg);color:var(--txt);font-family:'Vazirmatn',sans-serif;font-size:14px;line-height:1.7;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  body.locked{overflow:hidden}
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
  html.no-icons i[data-lucide]{display:none!important}
  .page{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 62px) 12px calc(150px + env(safe-area-inset-bottom))}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:60;background:rgba(17,24,20,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px}
  .tb-btn{width:42px;height:42px;border:none;background:transparent;color:var(--txt);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .tb-btn:hover{background:rgba(255,255,255,.06)}.tb-btn:active{transform:scale(.94)}
  .tb-btn svg{width:21px;height:21px}
  .tb-title{flex:1;min-width:0;font-size:16.5px;font-weight:800;margin:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
  .tb-title small{display:block;font-size:10px;font-weight:600;color:var(--faint);margin-top:-4px}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabbtn{flex-shrink:0;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:99px;padding:5px 15px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
  .tabbtn.on{background:var(--acc-dark);border-color:var(--acc);color:var(--acc)}
  .tabbtn b{font-family:var(--mono);font-size:10px;opacity:.75;font-weight:600;margin-right:5px}
  .conncard{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
  .conncard.on{border-color:#1a5c45}
  .conn-head{display:flex;align-items:center;gap:12px;padding:11px 13px;cursor:pointer;-webkit-user-select:none;user-select:none}
  .conn-info{flex:1;min-width:0}
  .conn-info .lbl{font-size:10px;color:var(--faint);font-weight:700}
  .conn-info .nm{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conn-info .hs{font-family:var(--mono);font-size:10.5px;color:var(--sub);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chev{width:20px;height:20px;color:var(--faint);flex-shrink:0;transition:transform .2s}
  .conncard.open .chev{transform:rotate(180deg)}
  .conn-body{display:none;padding:0 14px 14px;text-align:center}
  .conncard.open .conn-body{display:block}
  .ring-wrap{display:flex;justify-content:center;padding:14px 0 4px}
  .ring{position:relative;width:210px;height:210px;cursor:pointer;user-select:none;touch-action:manipulation}
  .ring svg{width:100%;height:100%;overflow:visible}
  .ring .track{fill:none;stroke:var(--line);stroke-width:5}
  .ring .prog{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;stroke-dasharray:653.45;stroke-dashoffset:653.45;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .7s cubic-bezier(.3,.8,.3,1)}
  .ring.err .prog{stroke:var(--err)}
  .ring .arc1,.ring .arc2{fill:none;stroke-width:2.5;stroke-linecap:round}
  .ring .arc1{stroke:var(--acc);stroke-dasharray:80 498;opacity:.55}
  .ring .arc2{stroke:var(--faint);stroke-dasharray:170 408;opacity:.5}
  .ring g.spin1,.ring g.spin2{transform-origin:center}
  .ring g.spin1{animation:spin 10s linear infinite}
  .ring g.spin2{animation:spin 14s linear infinite reverse}
  .ring.busy g.spin1{animation-duration:1.1s}.ring.busy g.spin2{animation-duration:1.7s}.ring.busy .arc1{opacity:1}
  .ring.on .arc1,.ring.on .arc2,.ring.err .arc1,.ring.err .arc2{opacity:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ring-core{position:absolute;inset:24px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px}
  .ring.on .ring-core{border-color:#1a5c45;box-shadow:0 0 26px rgba(47,230,168,.12)}
  .ring-core svg{width:24px;height:24px;color:var(--sub)}
  .ring-core .word{font-size:17px;font-weight:800}
  .ring-core small{font-size:9.5px;color:var(--faint);line-height:1.5}
  .ring-core .ms{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--acc);direction:ltr}
  .ring-core .spinning{animation:spin 1.4s linear infinite}
  .badge-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .badge-ic svg{width:20px;height:20px;color:inherit}
  .badge-ic.ok{background:var(--acc-dark);color:var(--acc)}
  .badge-ic.bad{background:#3a1613;color:var(--err)}
  .metrics{display:flex;justify-content:center;margin:12px 0 2px;border-top:1px solid var(--line)}
  .metric{flex:1;padding:10px 4px 2px;border-left:1px solid var(--line)}
  .metric:last-child{border-left:none}
  .metric span{display:block;font-size:10px;color:var(--faint);font-weight:600}
  .metric b{font-size:13px;font-weight:800;font-family:var(--mono);direction:ltr;display:inline-block}
  .metric b.t{font-family:'Vazirmatn'}
  #spark{display:block;margin:2px auto 0;width:150px;height:32px}
  .cp-actions{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:10px}
  .cp-actions .btn{padding:6px 11px;font-size:11.5px}
  .hint{display:flex;align-items:flex-start;gap:7px;text-align:right;font-size:11px;color:var(--faint);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .hint svg{width:13px;height:13px;flex-shrink:0;margin-top:3px}
  .cfg-list{display:flex;flex-direction:column}
  .cfg{display:flex;align-items:stretch;gap:8px;border-bottom:1px solid var(--line);padding:11px 4px;cursor:pointer;position:relative;transition:background .15s}
  .cfg:active{background:rgba(255,255,255,.03)}
  .cfg.active{background:rgba(47,230,168,.05)}
  .cfg.active::before{content:'';position:absolute;right:-12px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--acc)}
  .cfg-main{flex:1;min-width:0;align-self:center}
  .cfg-name{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cfg-host{font-family:var(--mono);font-size:11px;color:var(--sub);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .proto{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;color:var(--acc);border:1px solid #1a5c45;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:1px}
  .grade{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;width:17px;height:17px;line-height:15px;text-align:center;border-radius:5px;margin-left:6px;vertical-align:1px;border:1px solid transparent}
  .g-A{color:#06130d;background:var(--acc)}.g-B{color:var(--acc);background:var(--acc-dark);border-color:#1a5c45}
  .g-C{color:var(--warn);background:#3a2b12;border-color:#5c4419}.g-D{color:#ff9459;background:#36200f;border-color:#5c3719}.g-E{color:var(--err);background:#3a1613;border-color:#5c2320}
  .cfg-side{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;flex-shrink:0}
  .cfg-acts{display:flex;gap:2px}
  .ibtn{width:32px;height:32px;border-radius:9px;border:none;background:transparent;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .ibtn:hover{background:var(--inset);color:var(--txt)}
  .ibtn.danger:hover{color:var(--err)}
  .ibtn svg{width:16px;height:16px}
  .cfg-ping{font-family:var(--mono);font-size:11px;font-weight:600;direction:ltr}
  .cfg-ping .tag{font-family:'Vazirmatn';font-size:9.5px;color:var(--faint);font-weight:700;margin-left:4px}
  .p-ok{color:var(--ok)}.p-bad{color:var(--err)}.p-na{color:var(--faint)}
  .empty{text-align:center;padding:44px 16px;color:var(--faint);border:1px dashed var(--line);border-radius:14px;margin-top:8px}
  .empty p{font-size:13px;margin-bottom:12px}
  .empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 13px;border:1px solid var(--line);background:var(--panel);color:var(--txt);transition:.15s}
  .btn:hover{border-color:var(--line2);background:var(--panel2)}.btn:active{transform:scale(.97)}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#06130d}
  .btn.danger{color:var(--err)}
  .btn svg{width:14px;height:14px;flex-shrink:0}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .bottombar{position:fixed;bottom:0;left:0;right:0;z-index:55;pointer-events:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px calc(env(safe-area-inset-bottom) + 14px)}
  .fab{pointer-events:auto;width:66px;height:66px;border-radius:50%;background:#232e28;border:1px solid var(--line2);color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 26px rgba(0,0,0,.45);transition:.2s}
  .fab:active{transform:scale(.94)}
  .fab.on{background:var(--acc);color:#06130d;border-color:var(--acc)}
  .fab.busy{background:#3a2b12;border-color:var(--warn);color:var(--warn)}
  .fab svg{width:28px;height:28px}
  .fab .spinning{animation:spin 1.4s linear infinite}
  .status-chip{pointer-events:auto;background:rgba(15,23,20,.94);border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-size:12px;font-weight:700;color:var(--sub);display:flex;align-items:center;gap:7px}
  .status-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .status-chip.on{color:var(--acc)}.status-chip.on .dot{background:var(--acc)}
  .status-chip.busy{color:var(--warn)}.status-chip.busy .dot{background:var(--warn)}
  .status-chip.err{color:var(--err)}.status-chip.err .dot{background:var(--err)}
  .pop{position:fixed;z-index:80;background:#161f1a;border:1px solid var(--line2);border-radius:14px;min-width:265px;max-width:calc(100vw - 20px);max-height:calc(100dvh - 16px);max-height:calc(100vh - 16px);box-sizing:border-box;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;box-shadow:0 20px 60px rgba(0,0,0,.55);display:none;padding:6px}
  .pop.open{display:block;animation:popin .14s}
  @keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.98)}}
  .pop-head{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 2px}
  .pop-head b{font-size:12px;color:var(--faint)}
  .pop-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600}
  .pop-item:hover{background:rgba(255,255,255,.05)}.pop-item:active{background:var(--inset)}
  .pop-item svg{width:18px;height:18px;color:var(--sub);flex-shrink:0}
  .pop-item.danger,.pop-item.danger svg{color:var(--err)}
  .pop-sep{height:1px;background:var(--line);margin:6px 8px}
  .pop-title{font-size:10.5px;font-weight:800;color:var(--faint);padding:8px 12px 4px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:74;display:none}
  .scrim.open{display:block}
  .drawer{position:fixed;top:0;bottom:0;right:0;width:min(330px,88vw);z-index:75;background:#121b16;border-left:1px solid var(--line);transform:translateX(105%);transition:transform .26s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;overflow-y:auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:contain}
  .drawer.open{transform:none}
  .dr-head{display:flex;align-items:center;gap:12px;padding:16px 14px 14px 20px;border-bottom:1px solid var(--line)}
  .dr-head>div:not(.dr-logo){flex:1;min-width:0}
  .dr-logo{width:42px;height:42px;border-radius:12px;background:var(--acc);color:#06130d;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .dr-logo svg{width:21px;height:21px}
  .dr-head b{font-size:17px;font-weight:800;display:block}
  .dr-head small{font-size:10.5px;color:var(--faint)}
  .dr-item{display:flex;align-items:center;gap:14px;padding:11px 20px;cursor:pointer}
  .dr-item:hover{background:rgba(255,255,255,.04)}.dr-item:active{background:var(--inset)}
  .dr-item svg{width:19px;height:19px;color:var(--sub);flex-shrink:0}
  .dr-txt{flex:1;min-width:0}
  .dr-txt b{font-size:13.5px;font-weight:700;display:block}
  .dr-txt small{font-size:10.5px;color:var(--faint);display:block;line-height:1.5;margin-top:-2px}
  .dr-sep{height:1px;background:var(--line);margin:8px 14px}
  .lang-row{display:flex;gap:6px;padding:4px 16px 8px}
  .lang-row .tabbtn{flex:1;text-align:center}
  .dr-foot{margin-top:auto;padding:14px 20px;font-size:10.5px;color:var(--faint);border-top:1px solid var(--line);line-height:1.9}
  .dr-foot b{color:var(--acc)}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:82;background:var(--panel);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .26s cubic-bezier(.3,.8,.3,1);max-height:84vh;display:flex;flex-direction:column;padding-bottom:calc(env(safe-area-inset-bottom) + 10px)}
  .sheet.open{transform:none}
  .sh-handle{width:42px;height:4px;border-radius:4px;background:var(--line2);margin:10px auto 2px;flex-shrink:0}
  .sh-head{display:flex;align-items:flex-start;gap:8px;padding:6px 16px 12px;border-bottom:1px solid var(--line)}
  .sh-head>div{flex:1;min-width:0}
  .sh-head h4{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sh-head .m{font-family:var(--mono);font-size:11px;color:var(--sub);direction:ltr;text-align:right;margin-top:2px;word-break:break-all}
  .sh-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:14px 16px;overflow-y:auto;overscroll-behavior:contain}
  .sh-btn{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 4px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;color:var(--txt)}
  .sh-btn:active{transform:scale(.96)}
  .sh-btn svg{width:20px;height:20px;color:var(--acc)}
  .sh-btn.danger svg{color:var(--err)}
  .overlay{position:fixed;inset:0;background:rgba(4,8,6,.74);z-index:85;display:none;align-items:center;justify-content:center;padding:16px}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:18px;width:100%;max-width:520px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);min-height:0;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;animation:mup .2s}
  /* Long hamburger-menu panels: explicit height is also set in JS for Android WebView. */
  #ovSettings .modal,#ovSources .modal,#ovSubs .modal,.modal.tall-content{
    height:calc(100vh - 16px);
    max-height:calc(100vh - 16px);
    min-height:0;
    overflow:hidden;
  }
  @supports (height: 100dvh) {
    #ovSettings .modal,#ovSources .modal,#ovSubs .modal,.modal.tall-content{
      height:calc(100dvh - 16px);
      max-height:calc(100dvh - 16px);
    }
  }
  #ovSettings.overlay,#ovSources.overlay,#ovSubs.overlay,#ovConfirm.overlay:has(.modal.tall-content){
    padding:8px;
    box-sizing:border-box;
    overflow-y:auto;
  }
  @keyframes mup{from{transform:translateY(14px) scale(.98);opacity:0}}
  .m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
  .m-head h4{font-size:14.5px;font-weight:800}
  .m-body{padding:16px 18px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0;max-height:100%;overscroll-behavior:contain;touch-action:pan-y;scroll-behavior:smooth}
  .m-foot{padding:11px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;flex-shrink:0}
  .tabs-v{display:flex;gap:5px;margin-bottom:14px;background:var(--inset);border-radius:11px;padding:4px;border:1px solid var(--line);flex-wrap:wrap}
  .tabv{flex:1;border:none;background:transparent;color:var(--sub);font-family:inherit;font-size:12px;font-weight:700;padding:8px 6px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.15s;touch-action:manipulation;min-height:42px;min-width:88px}
  .tabv.on{background:var(--acc);color:#06130d}
  .tpane{display:none}.tpane.on{display:block}
  input,textarea,select{background:var(--inset);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-family:inherit;font-size:13px;padding:9px 12px;width:100%;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--acc)}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  textarea{resize:vertical;min-height:100px;font-family:var(--mono);font-size:12px}
  label.fld{display:block;font-size:11.5px;color:var(--sub);margin:10px 0 4px;font-weight:700}
  select option{background:var(--panel);color:var(--txt)}
  .kv{width:100%;border-collapse:collapse;font-size:12px}
  .kv td{padding:6px 4px;border-bottom:1px solid var(--line)}
  .kv td:first-child{color:var(--faint);width:105px;font-size:11px}
  .kv td:last-child{font-family:var(--mono);direction:ltr;text-align:left;word-break:break-all}
  .qr-box{display:flex;justify-content:center;padding:6px 0}
  .qr-box canvas{border-radius:12px;max-width:100%}
  .fmt-row{display:flex;gap:8px;align-items:center;margin:12px 0 8px}
  .fmt-row select{flex:1}
  .outbox{width:100%;min-height:140px;font-family:var(--mono);font-size:10.5px;direction:ltr;background:var(--inset)}
  .sgroup{border:1px solid var(--line);border-radius:13px;padding:4px 14px 6px;margin-top:12px}
  .sgroup>.sg-title{font-size:10.5px;font-weight:800;color:var(--faint);padding:9px 0 2px}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:none}
  .srow .st{min-width:0}
  .srow .st b{font-size:12.5px;font-weight:700;display:block}
  .srow .st small{font-size:10.5px;color:var(--faint);line-height:1.6;display:block;margin-top:1px}
  .srow>select,.srow>input{width:145px;flex-shrink:0;padding:6px 9px;font-size:12px}
  .srow>input.num{width:76px;text-align:center;direction:ltr}
  .srow>.btn{flex-shrink:0;padding:6px 11px;font-size:12px}
  .sw{position:relative;width:40px;height:22px;flex-shrink:0}
  .sw input{display:none}
  .sw i{position:absolute;inset:0;background:var(--inset);border:1px solid var(--line2);border-radius:99px;cursor:pointer;transition:.15s}
  .sw i::after{content:'';position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--faint);transition:.15s}
  .sw input:checked+i{background:var(--acc-dark);border-color:var(--acc)}
  .sw input:checked+i::after{background:var(--acc);transform:translateX(-18px)}
  .frag-fields{display:none;padding:9px 0 3px}
  .frag-fields.show{display:block}
  .ff-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .ff-grid label{font-size:10px;color:var(--faint);display:block;margin-bottom:3px}
  .ff-grid input,.ff-grid select{padding:6px 8px;font-size:11px;font-family:var(--mono);direction:ltr}
  .sec-top{display:flex;align-items:center;gap:16px;margin-bottom:13px}
  .sec-donut{position:relative;width:96px;height:96px;flex-shrink:0}
  .sec-donut svg{width:100%;height:100%;transform:rotate(-90deg)}
  .sec-donut .tr{fill:none;stroke:var(--line);stroke-width:8}
  .sec-donut .fl{fill:none;stroke:var(--acc);stroke-width:8;stroke-linecap:round}
  .sec-donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .sec-donut .ctr b{font-family:var(--mono);font-size:21px;direction:ltr}
  .sec-donut .ctr span{font-size:9.5px;color:var(--faint)}
  .sec-grade{font-family:var(--mono);font-size:23px;font-weight:600;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;margin-top:4px}
  .sec-cats{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  .bar-row{display:flex;align-items:center;gap:8px;font-size:11px}
  .bar-row span{width:60px;color:var(--sub);flex-shrink:0}
  .bar{flex:1;height:6px;background:var(--inset);border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
  .bar-row b{font-family:var(--mono);font-size:10.5px;width:26px;direction:ltr;text-align:left}
  .sec-item{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;padding:5px 0;border-bottom:1px solid var(--line)}
  .sec-item:last-child{border-bottom:none}
  .sec-item svg{width:13px;height:13px;flex-shrink:0;margin-top:3px}
  .sec-item.good{color:#bdeedd}.sec-item.good svg{color:var(--acc)}
  .sec-item.bad{color:#f3c1bd}.sec-item.bad svg{color:var(--err)}
  .sec-item.warn{color:#f0d9b4}.sec-item.warn svg{color:var(--warn)}
  .smart-sum{font-size:12px;color:var(--sub);margin-bottom:7px}
  .sm-bar{height:5px;background:var(--inset);border-radius:5px;overflow:hidden;margin-bottom:10px}
  .sm-bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
  .sm-list{display:flex;flex-direction:column;gap:5px;max-height:300px;overflow-y:auto;overscroll-behavior:contain}
  .sm-row{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px}
  .sm-row.best{border-color:var(--acc)}
  .sm-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .sm-row .pv{font-family:var(--mono);font-size:10.5px;color:var(--sub);direction:ltr;flex-shrink:0}
  .sm-row .sc{font-family:var(--mono);font-size:10.5px;color:var(--acc);direction:ltr;flex-shrink:0;width:30px;text-align:left}
  .sm-tag{font-size:9px;background:var(--acc);color:#06130d;border-radius:5px;padding:1px 6px;font-weight:800;flex-shrink:0}
  .src-row{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .src-row:last-child{border-bottom:none}
  .src-ic{width:36px;height:36px;border-radius:10px;background:var(--acc-dark);color:var(--acc);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .src-ic svg{width:17px;height:17px}
  .src-main{flex:1;min-width:0}
  .src-main b{font-size:12.5px;display:block}
  .src-main small{font-size:10.5px;color:var(--faint);display:block;line-height:1.5}
  .src-row .btn{padding:5px 11px;font-size:11.5px;flex-shrink:0}
  .subcard{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .subhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .subhead b{font-size:13.5px;font-weight:800}
  .subhead .cnt{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .qbar{height:8px;background:var(--inset);border-radius:8px;overflow:hidden;margin:4px 0 10px}
  .qbar i{display:block;height:100%;border-radius:8px;transition:width .6s}
  .qrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:3px 0}
  .qrow span{color:var(--sub)}
  .qrow b{font-family:var(--mono);direction:ltr}
  .subacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .subacts .btn{padding:5px 10px;font-size:11px}
  .qnoinfo{font-size:11.5px;color:var(--faint)}
  #scanVideo{width:100%;max-width:340px;border-radius:14px;background:#000;display:block;margin:0 auto}
  #scanCanvas{display:none}
  .scan-hint{text-align:center;font-size:12px;color:var(--sub);margin-top:10px}
  #toasts{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:16px;z-index:99;display:flex;flex-direction:column;gap:7px;max-width:calc(100vw - 32px)}
  .toast{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 15px;font-size:12.5px;display:flex;align-items:center;gap:8px;animation:tin .22s;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .toast svg{width:15px;height:15px;color:var(--acc)}
  .toast.warn svg{color:var(--warn)}.toast.err svg{color:var(--err)}
  @keyframes tin{from{transform:translateY(8px);opacity:0}}
  .toast.out{transition:.3s;opacity:0;transform:translateY(6px)}
  #dnd{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(6,12,9,.85)}
  #dnd.show{display:flex}
  #dnd .box{border:2px dashed var(--acc);border-radius:18px;padding:32px 40px;color:var(--acc);font-weight:800}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
  [dir="ltr"] .cfg.active::before{right:auto;left:-12px}
  [dir="ltr"] .metric{border-left:none;border-right:1px solid var(--line)}
  [dir="ltr"] .metric:first-child{border-right:none}
  [dir="ltr"] .tb-title,[dir="ltr"] .cfg-host{text-align:left}
  [dir="ltr"] .drawer{right:auto;left:0;border-left:none;border-right:1px solid var(--line);transform:translateX(-105%)}
  [dir="ltr"] .drawer.open{transform:none}
  [dir="ltr"] .conn-info .hs,[dir="ltr"] .sh-head .m{text-align:left}
  [dir="ltr"] .sh-head .m{direction:rtl}
  [dir="ltr"] .dr-head{padding:16px 20px 14px 14px}
  @media(min-width:700px){
    .sheet{left:50%;right:auto;transform:translate(-50%,105%);width:560px;border:1px solid var(--line2);border-bottom:none}
    .sheet.open{transform:translate(-50%,0)}
    .page{padding-top:calc(env(safe-area-inset-top) + 70px)}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="topbar">
  <button class="tb-btn" id="btnMore" data-pop="#popMore"><i data-lucide="more-vertical"></i></button>
  <button class="tb-btn" id="btnAddM" data-pop="#popAdd"><i data-lucide="plus"></i></button>
  <button class="tb-btn" id="btnFilter" data-pop="#popFilter"><i data-lucide="filter"></i></button>
  <div class="tb-title"><span data-i18n="tb_title">فایل کانفیگ</span><small id="tbSub"></small></div>
  <button class="tb-btn" id="btnDrawer"><i data-lucide="menu"></i></button>
</div>

<div class="page">
  <div class="tabs" id="tabRow"></div>

  <div class="conncard open" id="connCard">
    <div class="conn-head" id="connHead">
      <div class="conn-info">
        <div class="lbl" data-i18n="lbl_active">کانفیگ فعال</div>
        <div class="nm" id="acName"></div>
        <div class="hs" id="acHost"></div>
      </div>
      <i data-lucide="chevron-down" class="chev"></i>
    </div>
    <div class="conn-body">
      <div class="ring-wrap">
        <div class="ring idle" id="ring" role="button" tabindex="0" data-conn>
          <svg viewBox="0 0 240 240">
            <circle class="track" cx="120" cy="120" r="104"/>
            <circle class="prog" id="ringProg" cx="120" cy="120" r="104"/>
            <g class="spin1"><circle class="arc1" cx="120" cy="120" r="92"/></g>
            <g class="spin2"><circle class="arc2" cx="120" cy="120" r="92"/></g>
          </svg>
          <div class="ring-core" id="ringCore"></div>
        </div>
      </div>
      <div class="metrics" id="metrics"></div>
      <canvas id="spark" width="150" height="32"></canvas>
      <div class="cp-actions" id="cpActions"></div>
      <div class="hint"><i data-lucide="info"></i><span id="hintTxt"></span></div>
    </div>
  </div>

  <div class="cfg-list" id="cfgList"></div>

  <footer style="display:flex;align-items:center;justify-content:center;gap:8px;padding:22px 0 6px;border-top:1px solid var(--line);margin-top:18px;font-size:12px;color:var(--faint)">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#2fe6a8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17 L12 8 L18 17"/><circle cx="12" cy="7" r="1.6" fill="#2fe6a8" stroke="none"/><circle cx="5.5" cy="18" r="1.4" fill="#2fe6a8" stroke="none"/><circle cx="18.5" cy="18" r="1.4" fill="#2fe6a8" stroke="none"/></svg>
    <span><span data-i18n="credit">برنامه‌نویسی‌شده توسط</span> <b style="color:var(--acc)">محمد حسین زاده</b></span>
  </footer>
</div>

<div class="bottombar">
  <button class="fab" id="fab" data-conn><i data-lucide="play"></i></button>
  <div class="status-chip" id="statusChip"><span class="dot"></span><span id="statusTxt"></span></div>
</div>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer">
  <div class="dr-head">
    <div class="dr-logo"><i data-lucide="waypoints"></i></div>
    <div><b data-i18n="app">گذر</b><small data-i18n="d_ver"></small></div>
    <button class="ibtn" data-close-drawer><i data-lucide="x"></i></button>
  </div>
  <div class="dr-item" id="drSubs2"><i data-lucide="battery-charging"></i><div class="dr-txt"><b data-i18n="d_subs2"></b><small data-i18n="d_subs2_s"></small></div></div>
  <div class="dr-item" id="drGroup"><i data-lucide="layers"></i><div class="dr-txt"><b data-i18n="d_group"></b><small data-i18n="d_group_s"></small></div></div>
  <div class="dr-item" id="drRouting"><i data-lucide="map"></i><div class="dr-txt"><b data-i18n="d_routing"></b><small data-i18n="d_routing_s"></small></div></div>
  <div class="dr-item" id="drDpi"><i data-lucide="sliders-horizontal"></i><div class="dr-txt"><b data-i18n="d_dpi"></b><small data-i18n="d_dpi_s"></small></div></div>
  <div class="dr-item" id="drRules2"><i data-lucide="git-branch"></i><div class="dr-txt"><b data-i18n="st_g5"></b><small data-i18n="st_g5_s"></small></div></div>
  <div class="dr-item" id="drGeo"><i data-lucide="file-plus"></i><div class="dr-txt"><b data-i18n="d_geo"></b><small data-i18n="d_geo_s"></small></div></div>
  <div class="dr-item" id="drSettings"><i data-lucide="settings"></i><div class="dr-txt"><b data-i18n="d_set"></b><small data-i18n="d_set_s"></small></div></div>
  <div class="dr-sep"></div>
  <div class="dr-item" id="drLogs"><i data-lucide="terminal"></i><div class="dr-txt"><b data-i18n="d_logs"></b><small data-i18n="d_logs_s"></small></div></div>
  <div class="dr-item" id="drCoreLog"><i data-lucide="file-code"></i><div class="dr-txt"><b data-i18n="d_corelog"></b><small data-i18n="d_corelog_s"></small></div></div>
  <div class="dr-item" id="drBackup"><i data-lucide="download"></i><div class="dr-txt"><b data-i18n="d_backup"></b><small data-i18n="d_backup_s"></small></div></div>
  <div class="dr-item" id="drUpdate"><i data-lucide="refresh-cw"></i><div class="dr-txt"><b data-i18n="d_update"></b><small data-i18n="d_update_s"></small></div></div>
  <div class="dr-item" id="drAbout"><i data-lucide="info"></i><div class="dr-txt"><b data-i18n="d_about"></b><small data-i18n="d_about_s"></small></div></div>
  <div class="dr-sep"></div>
  <div class="pop-title" style="padding:4px 20px 0" data-i18n="d_lang">زبان</div>
  <div class="lang-row">
    <button class="tabbtn lang-b" data-lang="fa">فارسی</button>
    <button class="tabbtn lang-b" data-lang="ar">العربية</button>
    <button class="tabbtn lang-b" data-lang="en">English</button>
  </div>
  <div class="dr-foot" id="drFoot"></div>
</nav>

<div class="pop" id="popMore">
  <div class="pop-item" id="mRestart"><i data-lucide="rotate-cw"></i><span data-i18n="p_restart"></span></div>
  <div class="pop-sep"></div>
  <div class="pop-item danger" id="mDelDupes"><i data-lucide="trash-2"></i><span data-i18n="p_deldup"></span></div>
  <div class="pop-item danger" id="mDelInvalid"><i data-lucide="shield-x"></i><span data-i18n="p_delinv"></span></div>
  <div class="pop-item danger" id="mDelAll"><i data-lucide="trash-2"></i><span data-i18n="p_delall"></span></div>
  <div class="pop-sep"></div>
  <div class="pop-item" id="mExport"><i data-lucide="upload"></i><span data-i18n="p_export"></span></div>
  <div class="pop-item" id="mSmart"><i data-lucide="sparkles"></i><span data-i18n="p_smart"></span></div>
  <div class="pop-sep"></div>
  <div class="pop-item" id="mTcping"><i data-lucide="activity"></i><span data-i18n="p_tcping"></span></div>
  <div class="pop-item" id="mReal"><i data-lucide="gauge"></i><span data-i18n="p_real"></span></div>
  <div class="pop-item" id="mSort"><i data-lucide="arrow-down-up"></i><span data-i18n="p_sort"></span></div>
  <div class="pop-sep"></div>
  <div class="pop-item" id="mUpdateSub"><i data-lucide="refresh-cw"></i><span data-i18n="p_upd"></span></div>
</div>

<div class="pop" id="popAdd">
  <div class="pop-title" data-i18n="pa_imp"></div>
  <div class="pop-item" id="aQrScan"><i data-lucide="camera"></i><span data-i18n="pa_qr"></span></div>
  <div class="pop-item" id="aClip"><i data-lucide="clipboard"></i><span data-i18n="pa_clip"></span></div>
  <div class="pop-item" id="aFile"><i data-lucide="file-up"></i><span data-i18n="pa_file"></span></div>
  <div class="pop-item" id="aLink"><i data-lucide="link"></i><span data-i18n="pa_link"></span></div>
  <div class="pop-sep"></div>
  <div class="pop-title" data-i18n="pa_man"></div>
  <div id="manualList"></div>
</div>

<div class="pop" id="popFilter" style="min-width:290px">
  <div class="pop-head"><b data-i18n="pf_t"></b><button class="ibtn" data-close><i data-lucide="x"></i></button></div>
  <div style="padding:4px 10px 10px">
    <input id="fq" data-i18n-ph="pf_q">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px" id="fProtoChips"></div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;font-weight:700;cursor:pointer">
      <input type="checkbox" id="fAlive" style="width:16px;height:16px"><span data-i18n="pf_alive"></span>
    </label>
    <label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;font-weight:700;cursor:pointer">
      <input type="checkbox" id="fSecure" style="width:16px;height:16px"><span data-i18n="pf_sec"></span>
    </label>
  </div>
</div>

<div class="scrim" id="sheetScrim" style="z-index:81"></div>
<div class="sheet" id="sheet">
  <div class="sh-handle"></div>
  <div class="sh-head">
    <div><h4 id="shTitle"></h4><div class="m" id="shMeta"></div></div>
    <button class="ibtn" data-close-sheet><i data-lucide="x"></i></button>
  </div>
  <div class="sh-grid">
    <button class="sh-btn" id="shConnect2"><i data-lucide="play"></i><span data-i18n="sh_conn"></span></button>
    <button class="sh-btn" id="shTest"><i data-lucide="activity"></i><span data-i18n="sh_test"></span></button>
    <button class="sh-btn" id="shSec"><i data-lucide="shield-check"></i><span data-i18n="sh_sec"></span></button>
    <button class="sh-btn" id="shQr"><i data-lucide="qr-code"></i><span>QR</span></button>
    <button class="sh-btn" id="shDetail"><i data-lucide="settings-2"></i><span data-i18n="sh_det"></span></button>
    <button class="sh-btn" id="shCopy"><i data-lucide="copy"></i><span data-i18n="sh_copy"></span></button>
    <button class="sh-btn" id="shShare"><i data-lucide="share-2"></i><span data-i18n="sh_share"></span></button>
    <button class="sh-btn" id="shRename"><i data-lucide="pencil"></i><span data-i18n="sh_ren"></span></button>
    <button class="sh-btn danger" id="shDel"><i data-lucide="trash-2"></i><span data-i18n="sh_del"></span></button>
  </div>
</div>

<div class="overlay" id="ovAdd">
  <div class="modal">
    <div class="m-head"><h4 data-i18n="add_t"></h4><button class="ibtn" data-close><i data-lucide="x"></i></button></div>
    <div class="m-body">
      <div class="tabs-v">
        <button class="tabv on" data-tab="t1" data-i18n="add_t1"></button>
        <button class="tabv" data-tab="t3" data-i18n="add_t3"></button>
      </div>
      <div class="tpane on" id="t1">
        <label class="fld" data-i18n="f_link"></label>
        <textarea id="inMulti" dir="ltr" placeholder="vless://…&#10;https://example.com/sub"></textarea>
        <input type="file" id="fileOne" accept=".txt,.json,.conf,text/plain" hidden>
        <button class="btn primary" id="btnAddMulti" style="margin-top:12px;width:100%;justify-content:center"><i data-lucide="upload"></i><span data-i18n="f_fetch"></span></button>
        <p style="font-size:11px;color:var(--faint);margin-top:8px" data-i18n="f_note"></p>
      </div>
      <div class="tpane" id="t3">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 10px">
          <div style="grid-column:1/-1"><label class="fld" data-i18n="f_name"></label><input id="f_name"></div>
          <div><label class="fld" data-i18n="f_proto"></label>
            <select id="f_proto"><option value="vless">VLESS</option><option value="vmess">VMess</option><option value="trojan">Trojan</option><option value="ss">Shadowsocks</option><option value="hysteria2">Hysteria2</option><option value="tuic">TUIC</option></select></div>
          <div><label class="fld" data-i18n="f_server"></label><input id="f_server" dir="ltr"></div>
          <div><label class="fld" data-i18n="f_port"></label><input id="f_port" dir="ltr" placeholder="443" inputmode="numeric"></div>
          <div><label class="fld" data-i18n="f_secret"></label><input id="f_secret" dir="ltr"></div>
          <div><label class="fld" data-i18n="f_net"></label>
            <select id="f_net"><option value="tcp">TCP</option><option value="ws">WebSocket</option><option value="grpc">gRPC</option></select></div>
          <div><label class="fld" data-i18n="f_tc"></label>
            <select id="f_sec"><option value="tls">TLS</option><option value="reality">Reality (VLESS)</option><option value="none" data-i18n="none_opt"></option></select></div>
          <div><label class="fld">SNI</label><input id="f_sni" dir="ltr"></div>
          <div><label class="fld">Path</label><input id="f_path" dir="ltr" placeholder="/"></div>
          <div><label class="fld" data-i18n="f_method"></label><input id="f_method" dir="ltr" placeholder="aes-256-gcm"></div>
          <div><label class="fld" data-i18n="f_pass"></label><input id="f_pass" dir="ltr"></div>
        </div>
        <button class="btn primary" id="btnAddForm" style="margin-top:12px;width:100%;justify-content:center"><i data-lucide="plus"></i><span data-i18n="f_make"></span></button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="ovScan">
  <div class="modal" style="max-width:400px">
    <div class="m-head"><h4 data-i18n="sc_t"></h4><button class="ibtn" data-close id="scanClose"><i data-lucide="x"></i></button></div>
    <div class="m-body">
      <video id="scanVideo" playsinline muted></video>
      <canvas id="scanCanvas"></canvas>
      <p class="scan-hint" data-i18n="sc_h"></p>
    </div>
  </div>
</div>

<div class="overlay" id="ovQr">
  <div class="modal" style="max-width:360px">
    <div class="m-head"><h4 id="qrTitle"></h4><button class="ibtn" data-close><i data-lucide="x"></i></button></div>

function safeDecode(s){ try{ return decodeURIComponent(s||''); }catch(e){ return s||''; } }
function parseLink(raw){
  raw=String(raw||'').trim(); if(!raw) return null;
  const scheme=raw.split('://')[0].toLowerCase();
  try{
    if(scheme==='vmess'){
      try{ const j=JSON.parse(b64d(raw.slice(8))); if(!j.add) return null;
        return {proto:'vmess',name:j.ps||'',server:j.add,port:+j.port||443,secret:j.id||'',alterId:+j.aid||0,cipher:j.scy||'auto',net:j.net||'tcp',tls:j.tls==='tls',sni:j.sni||'',hostHeader:j.host||'',path:j.path||'',raw:raw};
      }catch(_){ return parseURLish(raw,'vmess'); }
    }
    if(['vless','trojan','ss','hysteria2','hy2','tuic'].indexOf(scheme)!==-1) return parseURLish(raw,scheme);
  }catch(e){}
  return null;
}
function parseURLish(raw,scheme){
  const u=new URL(raw);
  const proto=scheme==='hy2'?'hysteria2':scheme;
  const host=u.hostname,port=+u.port||443,sp=u.searchParams;
  let name=''; try{ name=decodeURIComponent(u.hash.slice(1)); }catch(e){ name=u.hash.slice(1); }
  name=name||(proto+'-'+host+':'+port);
  const c={proto:proto,name:name,server:host,port:port,raw:raw};
  const net=(sp.get('type')||sp.get('network')||'tcp').toLowerCase();
  const sec=(sp.get('security')||'').toLowerCase();
  c.security=sec;
  c.net=(net==='ws'||net==='grpc')?net:'tcp';
  c.sni=sp.get('sni')||sp.get('serverName')||sp.get('peer')||'';
  c.fp=sp.get('fp')||''; c.flow=sp.get('flow')||''; c.alpn=sp.get('alpn')||'';
  c.path=sp.get('path')||sp.get('serviceName')||'';
  c.hostHeader=sp.get('host')||sp.get('authority')||'';
  c.insecure=(sp.get('insecure')==='1'||sp.get('insecure')==='true'||sp.get('allowInsecure')==='1'||sp.get('allowInsecure')==='true');
  c.tls=proto==='trojan'||proto==='hysteria2'||proto==='tuic'||sec==='tls'||sec==='reality'||(!sec&&!!c.sni);
  if(proto==='vless'){
    c.secret=safeDecode(u.username);
    if(sec==='reality'){
      c.pbk=sp.get('pbk')||sp.get('publicKey')||'';
      c.sid=sp.get('sid')||sp.get('shortId')||'';
      c.spx=sp.get('spx')||sp.get('spiderX')||'';
    }
    if(!c.secret) return null;
  }
  else if(proto==='trojan'){ c.secret=safeDecode(u.username); if(!c.secret) return null; }
  else if(proto==='hysteria2'){ c.secret=safeDecode(u.username)||safeDecode(u.password); c.obfs=sp.get('obfs')||''; c.obfsPass=sp.get('obfs-password')||''; if(!c.secret) return null; }
  else if(proto==='tuic'){ c.secret=safeDecode(u.username); c.pass=safeDecode(u.password); if(!c.secret) return null; }
  else if(proto==='ss'){
    const rest=raw.slice(5); const hi=rest.lastIndexOf('#');
    let body=hi>=0?rest.slice(0,hi):rest;
    const qi=body.indexOf('?'); if(qi>=0) body=body.slice(0,qi);
    const at=body.lastIndexOf('@');
    if(at>=0){
      const ui=body.slice(0,at); let method=null,pass=null;
      try{ const d=b64d(ui); const p1=d.indexOf(':'); if(p1!==-1){ method=d.slice(0,p1); pass=d.slice(p1+1); } }catch(_){}
      if(method===null){ const s2=safeDecode(ui); const p2=s2.indexOf(':'); if(p2!==-1){ method=s2.slice(0,p2); pass=s2.slice(p2+1); } }
      const hp=splitHostPort(body.slice(at+1));
      c.server=hp[0]; c.port=hp[1]; c.method=method; c.secret=pass;
    }else{
      const d=b64d(body); const m=d.match(/^(.+?):(.+)@(\[?[^\]]+\]?[^@]*):(\d+)$/);
      if(!m) return null; c.method=m[1]; c.secret=m[2]; c.server=m[3]; c.port=+m[4];
    }
    if(!c.method||!c.server) return null;
  }
  return c;
}
function buildFromForm(f){
  const name=encodeURIComponent(f.name||''); const q=[];
  if(f.proto==='vless'){
    q.push('security='+f.sec);
    if(f.sec!=='none'&&f.sni) q.push('sni='+encodeURIComponent(f.sni));
    q.push('type='+f.net);
    if(f.net==='ws'&&f.path) q.push('path='+encodeURIComponent(f.path));
    if(f.net==='grpc'&&f.path) q.push('serviceName='+encodeURIComponent(f.path));
    return 'vless://'+f.secret+'@'+f.server+':'+f.port+'?'+q.join('&')+'#'+name;
  }
  if(f.proto==='vmess'){ const j={v:'2',ps:f.name,add:f.server,port:String(f.port),id:f.secret,aid:'0',scy:'auto',net:f.net,type:'none',host:f.sni||'',path:f.net==='ws'?f.path:'',tls:f.sec==='none'?'':'tls',sni:f.sni||''}; return 'vmess://'+b64e(JSON.stringify(j)); }
  if(f.proto==='trojan'){ if(f.sni) q.push('sni='+encodeURIComponent(f.sni)); q.push('type='+f.net); if(f.net==='ws'&&f.path) q.push('path='+encodeURIComponent(f.path)); if(f.net==='grpc'&&f.path) q.push('serviceName='+encodeURIComponent(f.path)); return 'trojan://'+encodeURIComponent(f.secret)+'@'+f.server+':'+f.port+'?'+q.join('&')+'#'+name; }
  if(f.proto==='ss') return 'ss://'+b64e(f.method+':'+f.secret)+'@'+f.server+':'+f.port+'#'+name;
  if(f.proto==='hysteria2'){ if(f.sni) q.push('sni='+encodeURIComponent(f.sni)); return 'hysteria2://'+encodeURIComponent(f.secret)+'@'+f.server+':'+f.port+'?'+q.join('&')+'#'+name; }
  if(f.proto==='tuic'){ if(f.sni) q.push('sni='+encodeURIComponent(f.sni)); q.push('congestion_control=bbr'); return 'tuic://'+encodeURIComponent(f.secret)+':'+encodeURIComponent(f.pass||'')+'@'+f.server+':'+f.port+'?'+q.join('&')+'#'+name; }
  return null;
}

function tlsBlock(c){
  const tt={serverName:c.sni||c.server,allowInsecure:!!c.insecure};
  const fp=c.fp||settings.adv.fp;
  if(fp&&fp!=='none') tt.fingerprint=fp;
  const alpn=(c.alpn||settings.adv.alpn).trim();
  if(alpn) tt.alpn=alpn.split(',').map(function(x){return x.trim();}).filter(function(x){return !!x;});
  return tt;
}
function parseHosts(txt){
  const h={};
  String(txt||'').split('\n').forEach(function(l){
    const i=l.indexOf('=');
    if(i>0){ const k=l.slice(0,i).trim(),v=l.slice(i+1).trim(); if(k&&v) h[k]=v; }
  });
  return Object.keys(h).length?h:undefined;
}
function splitList(s){
  return String(s||'').split(',').map(function(x){ return x.trim(); }).filter(function(x){ return !!x; });
}
function xrayOut(c){
  if(['vless','vmess','trojan','ss'].indexOf(c.proto)===-1) return null;
  /* ═══ پورت SOCKS محلی پویا ═══ */
  const LPORT=Math.max(1024,+settings.core.socksPort||10808);
  const LPORT_H=LPORT+1;
  let proxy;
  if(c.proto==='vless') proxy={tag:'proxy',protocol:'vless',settings:{vnext:[{address:c.server,port:c.port,users:[{id:c.secret,encryption:'none',flow:c.flow||''}]}]}};
  else if(c.proto==='vmess') proxy={tag:'proxy',protocol:'vmess',settings:{vnext:[{address:c.server,port:c.port,users:[{id:c.secret,alterId:c.alterId||0,security:c.cipher||'auto'}]}]}};
  else if(c.proto==='trojan') proxy={tag:'proxy',protocol:'trojan',settings:{servers:[{address:c.server,port:c.port,password:c.secret}]}};
  else proxy={tag:'proxy',protocol:'shadowsocks',settings:{servers:[{address:c.server,port:c.port,method:c.method,password:c.secret}]}};
  const security=(c.security==='reality'||!!c.pbk)?'reality':((c.security==='tls'||c.tls)?'tls':'none');
  const st={network:c.net||'tcp',security:security};
  if(st.security==='tls') st.tlsSettings=tlsBlock(c);
  if(st.security==='reality'){
    // Reality has its own Xray schema; do not pass TLS-only fields such as allowInsecure.
    const rs={serverName:c.sni||c.server,publicKey:c.pbk||'',shortId:c.sid||''};
    const rfp=c.fp||settings.adv.fp;
    if(rfp&&rfp!=='none') rs.fingerprint=rfp;
    if(c.spx) rs.spiderX=c.spx;
    st.realitySettings=rs;
  }
  if(c.net==='ws') st.wsSettings={path:c.path||'/',headers:{Host:c.hostHeader||c.server}};
  if(c.net==='grpc') st.grpcSettings={serviceName:c.path||''};
  proxy.streamSettings=st;
  const outbounds=[proxy];
  if(settings.ir.frag&&(c.tls||c.pbk)){
    proxy.streamSettings.sockopt={dialerProxy:'fragment'};
    outbounds.push({tag:'fragment',protocol:'blackhole',settings:{fragment:{packets:settings.ir.packets,length:settings.ir.length||'100-200',interval:settings.ir.interval||'10-20'}}});
  }
  if(settings.ir.mux) proxy.mux={enabled:true,concurrency:Math.max(1,+settings.ir.muxConc||8)};
  outbounds.push({tag:'direct',protocol:'freedom',settings:{}});
  outbounds.push({tag:'block',protocol:'blackhole',settings:{response:{type:'http'}}});
  const rules=[];
  const R=settings.rules||{};
  if(settings.ir.ads) rules.push({type:'field',domain:['geosite:category-ads-all'],outboundTag:'block'});
  if(settings.ir.quic||R.blockUdp443) rules.push({type:'field',port:'443',network:'udp',outboundTag:'block'});
  if(R.bypassLanIp) rules.push({type:'field',ip:['geoip:private'],outboundTag:'direct'});
  if(R.bypassLanDom) rules.push({type:'field',domain:['geosite:private'],outboundTag:'direct'});
  if(R.proxyGoogle) rules.push({type:'field',domain:['geosite:google'],outboundTag:'proxy'});
  if(R.bypassDomesticDns){
    var dd=splitList(settings.core.domesticDns);
    if(dd.length) rules.push({type:'field',ip:dd,outboundTag:'direct'});
  }
  if(settings.ir.directIr){
    rules.push({type:'field',domain:['geosite:category-ir','domain:ir'],outboundTag:'direct'});
    rules.push({type:'field',ip:['geoip:ir'],outboundTag:'direct'});
  }
  (R.custom||[]).forEach(function(r){
    const o={type:'field',outboundTag:(r.outbound||'proxy')};
    const d=splitList(r.domains), ip=splitList(r.ips);
    if(d.length) o.domain=d;
    if(ip.length) o.ip=ip;
    if(r.port) o.port=String(r.port);
    if(r.network&&r.network!=='any') o.network=r.network;
    if(o.domain||o.ip||o.port) rules.push(o);
  });
  let dstrat='AsIs';
  if(settings.ir.directIr||R.bypassLanIp) dstrat='IPIfNonMatch';
  if(settings.core.preResolve==='useIP') dstrat='UseIP';
  else if(settings.core.preResolve==='useNonIP') dstrat='UseIPv4';
  const dnsServers=[];
  if(settings.core.remoteDns) dnsServers.push(settings.core.remoteDns);
  if(settings.core.domesticDns) dnsServers.push(settings.core.domesticDns);
  if(!dnsServers.length) dnsServers.push(settings.net.dns);
  const hosts=parseHosts(settings.core.dnsHosts);
  const dnsObj={servers:dnsServers};
  if(hosts) dnsObj.hosts=hosts;
  let sniff;
  if(settings.core.sniffing){
    sniff={enabled:true,destOverride:['http','tls','quic'],routeOnly:!!settings.core.routeOnly};
  }
  return JSON.stringify({
    log:{loglevel:settings.core.logLevel||'warning'},
    dns:dnsObj,
    inbounds:[
      /* Android VpnService creates the TUN interface. The bundled HEV JNI bridge
         reads its fd and forwards packets through this local SOCKS inbound. */
      {tag:'socks-in',listen:'127.0.0.1',port:LPORT,protocol:'socks',settings:{udp:true},sniffing:sniff},
      {tag:'http-in',listen:'127.0.0.1',port:LPORT_H,protocol:'http',settings:{}}
    ],
    outbounds:outbounds,
    routing:{domainStrategy:dstrat,rules:rules}
  },null,2);
}

function singboxOut(c){
  if(['vless','vmess','trojan','ss','hysteria2','tuic'].indexOf(c.proto)===-1) return null;
  const tr=function(){ if(c.net==='ws'){ const w={type:'ws',path:c.path||'/'}; if(c.hostHeader) w.headers={Host:c.hostHeader}; return w; } if(c.net==='grpc') return {type:'grpc',service_name:c.path||''}; return undefined; };
  let s=null;
  if(c.proto==='vless'){ s={type:'vless',tag:'proxy',server:c.server,server_port:c.port,uuid:c.secret,flow:c.flow||''}; s.tls=tlsBlock(c); s.tls.enabled=true; s.transport=tr(); }
  else if(c.proto==='vmess'){ s={type:'vmess',tag:'proxy',server:c.server,server_port:c.port,uuid:c.secret,alter_id:c.alterId||0,security:c.cipher||'auto'}; s.tls=tlsBlock(c); s.tls.enabled=!!c.tls; s.transport=tr(); }
  else if(c.proto==='trojan'){ s={type:'trojan',tag:'proxy',server:c.server,server_port:c.port,password:c.secret}; s.tls=tlsBlock(c); s.tls.enabled=true; s.transport=tr(); }
  else if(c.proto==='ss') s={type:'shadowsocks',tag:'proxy',server:c.server,server_port:c.port,method:c.method,password:c.secret};
  else if(c.proto==='hysteria2'){ s={type:'hysteria2',tag:'proxy',server:c.server,server_port:c.port,password:c.secret}; s.tls=tlsBlock(c); s.tls.enabled=true; }
  else if(c.proto==='tuic'){ s={type:'tuic',tag:'proxy',server:c.server,server_port:c.port,uuid:c.secret,password:c.pass||'',congestion_control:'bbr'}; s.tls=tlsBlock(c); s.tls.enabled=true; s.tls.alpn=['h3']; }
  if(settings.ir.mux&&s) s.multiplex={enabled:true,concurrency:Math.max(1,+settings.ir.muxConc||8)};
  const rules=[];
  const R=settings.rules||{};
  if(settings.ir.ads) rules.push({geosite:['category-ads-all'],outbound:'block'});
  if(settings.ir.quic||R.blockUdp443) rules.push({port:443,network:'udp',outbound:'block'});
  if(R.bypassLanIp) rules.push({geoip:['private'],outbound:'direct'});
  if(R.bypassLanDom) rules.push({geosite:['private'],outbound:'direct'});
  if(R.bypassDomesticDns){ var dd=splitList(settings.core.domesticDns); if(dd.length) rules.push({ip:dd,outbound:'direct'}); }
  if(settings.ir.directIr){
    rules.push({geosite:['category-ir'],outbound:'direct'});
    rules.push({domain_suffix:['.ir'],outbound:'direct'});
    rules.push({geoip:['ir'],outbound:'direct'});
  }
  (R.custom||[]).forEach(function(r){
    const o={outbound:(r.outbound||'proxy')};
    const d=splitList(r.domains), ip=splitList(r.ips);
    if(d.length) o.domain=d;
    if(ip.length) o.ip_cidr=ip;
    if(o.domain||o.ip_cidr) rules.push(o);
  });
  return JSON.stringify({log:{level:settings.core.logLevel==='warning'?'warn':(settings.core.logLevel||'warn')},dns:{servers:[{address:settings.net.dns}]},inbounds:[{type:'mixed',tag:'mixed-in',listen:'127.0.0.1',listen_port:Math.max(1024,+settings.core.socksPort||10808)}],outbounds:[s,{type:'block',tag:'block'},{type:'direct',tag:'direct'}],route:{rules:rules}},null,2);
}

function secAnalyze(c){
  const goods=[],bads=[],warns=[]; let enc=0,stealth=0,integrity=100;
  if(c.proto==='vless'){ if(c.pbk){enc+=40;stealth+=14;goods.push('Reality');} else if(c.tls){enc+=26;goods.push('TLS');} else {enc+=6;bads.push('no TLS');} if(c.flow==='xtls-rprx-vision') enc+=8; }
  else if(c.proto==='vmess'){ enc+=c.tls?24:10; if(c.alterId>0) bads.push('AlterID'); }
  else if(c.proto==='trojan') enc+=28;
  else if(c.proto==='ss'){ if(/gcm|chacha|2022/i.test(c.method||'')) enc+=22; else { enc+=8; bads.push(c.method||'?'); } }
  else if(c.proto==='hysteria2'){ enc+=30; if(c.obfs) stealth+=8; }
  else if(c.proto==='tuic') enc+=28;
  if(c.port===443) stealth+=18;
  else if(c.port===80||c.port===8080||c.port===8880){ stealth+=4; warns.push(':'+c.port); }
  else stealth+=10;
  if(c.net==='ws'&&c.tls) stealth+=8;
  if(c.net==='grpc'&&c.tls) stealth+=8;
  if(c.sni) stealth+=6;
  if(/cloudflare|workers\.dev|cdn|fastly|akamai/i.test(c.server)) stealth+=6;
  if(c.insecure){ integrity-=45; bads.push('allowInsecure'); }
  if(/^\d+\.\d+\.\d+\.\d+$/.test(c.server||'')&&!c.pbk) integrity-=10;
  const secret=String(c.secret||'');
  if(secret.length&&secret.length<12&&c.proto!=='ss') integrity-=15;
  if(c.src) warns.push(c.src);
  enc=Math.min(100,enc); stealth=Math.min(100,stealth); integrity=Math.max(0,Math.min(100,integrity));
  const score=Math.round(enc*.45+stealth*.25+integrity*.30);
  const grade=score>=80?'A':score>=64?'B':score>=48?'C':score>=32?'D':'E';
  return {score:score,grade:grade,enc:enc,stealth:stealth,integrity:integrity,goods:goods,bads:bads,warns:warns};
}

/* ═══════════ probe — اپ: پینگ TCP نیتیو (تونل-مستقل) / مرورگر: fetch ═══════════ */
function probe(server,port,timeout){
  timeout=timeout||settings.net.timeout*1000;
  /* داخل اپ اندروید: پینگ TCP نیتیو — دقیق مثل v2rayNG، مستقل از تونل و پروتکل */
  if(window.GozarAndroid&&window.GozarAndroid.tcpPing){
    const t0=performance.now();
    return new Promise(function(resolve){
      let done=false;
      const to=setTimeout(function(){
        if(!done){ done=true;
          resolve({ok:false,ms:performance.now()-t0,kind:'timeout'});
        }
      }, timeout);
      try{
        const r=window.GozarAndroid.tcpPing(server, port);
        clearTimeout(to);
        if(done) return;
        done=true;
        if(r&&r.indexOf('ok,')===0){
          resolve({ok:true, ms:performance.now()-t0, kind:'tcp'});
        }else{
          resolve({ok:false, ms:performance.now()-t0, kind:'refused'});
        }
      }catch(e){
        clearTimeout(to);
        if(!done){ done=true; resolve({ok:false,ms:performance.now()-t0,kind:'refused'}); }
      }
    });
  }
  /* مرورگر/PWA: fetch */
  const t0=performance.now();
  const url='https://'+server+':'+port+'/';
  if(typeof AbortController==='undefined'){
    return new Promise(function(resolve){
      let done=false;
      const to=setTimeout(function(){ if(!done){done=true;resolve({ok:false,ms:performance.now()-t0,kind:'timeout'});} },timeout);
      fetch(url,{mode:'no-cors',cache:'no-store'})
        .then(function(){ if(!done){done=true;clearTimeout(to);resolve({ok:true,ms:performance.now()-t0,kind:'http'});} })
        .catch(function(){ if(!done){done=true;clearTimeout(to);resolve({ok:false,ms:performance.now()-t0,kind:'refused'});} });
    });
  }
  const ctrl=new AbortController();
  const to=setTimeout(function(){ ctrl.abort(); },timeout);
  return fetch(url,{mode:'no-cors',signal:ctrl.signal,cache:'no-store'})
    .then(function(){ return {ok:true,ms:performance.now()-t0,kind:'http'}; })
    .catch(function(e){ const dt=performance.now()-t0; if(e&&e.name==='AbortError') return {ok:false,ms:dt,kind:'timeout'}; return {ok:false,ms:dt,kind:'refused'}; })
    .then(function(r){ clearTimeout(to); return r; });
}

  const maxViewportHeight=Math.max(1, vh-gap*2);
  const desired=Math.min(fullHeight, maxViewportHeight);
  const below=Math.max(0, vh-r.bottom-anchorGap-gap);
  const above=Math.max(0, r.top-anchorGap-gap);
  let top, maxH;

  if(desired <= below){
    top=r.bottom+anchorGap;
    maxH=Math.min(desired, vh-top-gap);
  }else if(desired <= above){
    maxH=desired;
    top=r.top-anchorGap-maxH;
  }else if(below >= above){
    // If neither side fits, use the largest available area and keep it scrollable.
    top=Math.max(gap, Math.min(r.bottom+anchorGap, vh-gap-Math.min(desired, maxViewportHeight)));
    maxH=Math.min(desired, vh-top-gap);
  }else{
    maxH=Math.min(desired, maxViewportHeight);
    top=gap;
  }

  maxH=Math.max(1, Math.min(maxH, vh-gap*2));
  top=Math.max(gap, Math.min(top, vh-gap-maxH));
  pop.style.maxHeight=maxH+'px';
  pop.style.top=top+'px';
  pop.scrollTop=0;
  pop.style.visibility='';
}

function addParsed(p){
  if(!p) return false;
  p.id=uid(); p.ping=null; p.addedAt=Date.now();

}
function afterAdd(n){
  if(state.configs.length>400){ state.configs=state.configs.slice(0,400); log(t('m_cap'),'warn'); }
  save(); renderTabs(); renderList(); renderActiveBar();

function extractLinks(text){
  text=String(text||'').trim();
  if(text.indexOf('://')===-1&&/^[A-Za-z0-9+/=_-]{20,}$/.test(text)){
    try{ const d=b64d(text); if(d.indexOf('://')!==-1) text=d; }catch(e){}
  }
  return text.split(/\s+/).filter(function(l){ return /^[a-z0-9+]+:\/\//i.test(l); });
}
function importFromText(text,label){
  const links=extractLinks(text);
  const seen={};
  for(var i=0;i<state.configs.length;i++) seen[state.configs[i].raw]=1;
  let n=0;
  for(var j=0;j<links.length;j++){
    if(seen[links[j]]) continue;
    const p=parseLink(links[j]);
    if(p){ if(addParsed(p)){ seen[links[j]]=1; n++; } }
  }
  if(n) afterAdd(n);
  else toast(t('m_nf_in',{x:label}),'warn');
  return n;
}
// Common entry point for clipboard and local files: supports raw links, base64
// subscription payloads, and a single HTTPS subscription URL.
async function importAnyText(raw,label){
  let text=String(raw||'').trim();
  if(!text){ toast(t('m_empty'),'warn'); return 0; }
  if(/^https?:\/\//i.test(text) && !/\s/.test(text)){
    try{
      const result=await fetchSub(text);
      text=result.text||'';
      if(result.info){
        const tag='custom-'+Date.now().toString(36);
        subMeta[tag]={url:raw.trim(),up:result.info.up,down:result.info.down,total:result.info.total,expire:result.info.expire,updated:Date.now()};
        saveSubMeta();
      }
    }catch(err){ toast(t('m_fail'),'err'); return 0; }
  }
  // JSON backup files exported by Gozar are handled without losing config names.
  try{
    const obj=JSON.parse(text);
    const arr=Array.isArray(obj)?obj:(obj&&Array.isArray(obj.configs)?obj.configs:null);
    if(arr){
      let count=0; const seen={};
      state.configs.forEach(function(c){ if(c.raw) seen[c.raw]=1; });
      arr.forEach(function(item){
        const rawLink=typeof item==='string'?item:(item&&item.raw);
        if(!rawLink||seen[rawLink]) return;
        const parsed=parseLink(rawLink);
        if(parsed){ if(item&&item.name) parsed.name=item.name; if(addParsed(parsed)){seen[rawLink]=1;count++;} }
      });
      if(count) afterAdd(count); else toast(t('m_nf_in',{x:label}),'warn');
      return count;
    }
  }catch(e){}
  return importFromText(text,label);
}

/* اسکنر QR */
let scanStream=null,scanRAF=null;
function loadJsQrFallback(){
  if(typeof jsQR!=='undefined') return Promise.resolve(true);
  return new Promise(function(resolve){
    const sources=[
      'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js',
      'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'
    ];
    let i=0;
    function next(){
      if(typeof jsQR!=='undefined'){ resolve(true); return; }
      if(i>=sources.length){ resolve(false); return; }
      const src=sources[i++],script=document.createElement('script');
      let settled=false;
      const finish=function(ok){
        if(settled) return; settled=true;
        script.onload=script.onerror=null;
        if(ok&&typeof jsQR!=='undefined') resolve(true); else next();
      };
      script.onload=function(){ finish(typeof jsQR!=='undefined'); };
      script.onerror=function(){ finish(false); };
      script.src=src;
      document.head.appendChild(script);
      setTimeout(function(){ finish(typeof jsQR!=='undefined'); },8000);
    }
    next();
  });
}
async function openScanner(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast(t('m_cam')+' (WebView/Android camera permission)', 'err');

    toast(t('m_jsqr')+' — check internet connection', 'err');

async function startScan(){
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});
    const v=$('#scanVideo');
    v.setAttribute('playsinline','');
    v.muted=true;
    v.srcObject=scanStream;
    await v.play();
    tickScan();
  }catch(e){
    const msg=(e&&e.name==='NotAllowedError')?'اجازهٔ دوربین را برای برنامه فعال کنید.':
      (e&&e.name==='NotFoundError')?'دوربین قابل استفاده پیدا نشد.':
      (e&&e.name==='NotReadableError')?'دوربین در برنامهٔ دیگری مشغول است.':
      'باز کردن دوربین ناموفق بود'+(e&&e.name?' ('+e.name+')':'');
    toast(msg,'err');
    stopScan();
    closeOv($('#ovScan'));
  }
}
function tickScan(){
  if(!scanStream) return;
  const v=$('#scanVideo'),c=$('#scanCanvas');
  if(v.readyState===v.HAVE_ENOUGH_DATA&&v.videoWidth){
    c.width=v.videoWidth; c.height=v.videoHeight;
    const ctx=c.getContext('2d');
    ctx.drawImage(v,0,0);
    const img=ctx.getImageData(0,0,c.width,c.height);
    let code=null;
    try{ code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'}); }catch(e){}
    if(code&&code.data){
      stopScan(); closeOv($('#ovScan'));
      const links=extractLinks(code.data);
      let n=0;
      for(var i=0;i<links.length;i++){ if(addParsed(parseLink(links[i]))) n++; }
      if(n) afterAdd(n);
      else toast(t('m_qrbad'),'err');
      return;
    }
  }
  scanRAF=requestAnimationFrame(tickScan);
}
function stopScan(){
  if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF=null; }
  if(scanStream){ try{ scanStream.getTracks().forEach(function(tr){ tr.stop(); }); }catch(e){} scanStream=null; }
}

      script.onerror=function(){ script.remove(); resolve(false); };
      document.head.appendChild(script);
    });
    if(loaded) return true;
  }
  return false;
}

let smRun=0,smBest=null;
function openSmart(){
  smBest=null; $('#smApply').disabled=true;
  openOv('#ovSmart'); icons();
  runSmart();
}
async function runSmart(){
  const my=++smRun;
  const list=currentList();
  if(!list.length){ $('#smSum').textContent=t('m_gempty'); return; }
  $('#smList').innerHTML=list.map(function(c){
    const s=secAnalyze(c);
    return '<div class="sm-row" id="smr-'+c.id+'"><span class="grade '+gradeCls(s.grade)+'">'+s.grade+'</span><span class="nm">'+esc(c.name)+'</span><span class="pv">…</span><span class="sc">—</span></div>';
  }).join('');
  let done=0;
  $('#smSum').textContent=t('m_gtest',{n:list.length});
  const tasks=list.map(function(c){
    return async function(){
      const r=await probe(c.server,c.port,Math.min(4500,settings.net.timeout*1000));
      if(my!==smRun) return;
      const s=secAnalyze(c);
      const ps=r.ok?Math.max(0,Math.round(50-r.ms/30)):0;
      const total=s.score+ps;
      const row=document.getElementById('smr-'+c.id);
      if(row){
        row.querySelector('.pv').textContent=r.ok?Math.round(r.ms)+'ms':'✗';
        row.querySelector('.sc').textContent=r.ok?total:'—';
      }
      if(r.ok&&(!smBest||total>smBest.total)){
        if(smBest){ const prev=document.getElementById('smr-'+smBest.id); if(prev){ prev.classList.remove('best'); const tg=prev.querySelector('.sm-tag'); if(tg&&tg.parentNode) tg.parentNode.removeChild(tg); } }
        smBest={id:c.id,ms:Math.round(r.ms),name:c.name};
        if(row){ row.classList.add('best'); row.insertAdjacentHTML('afterbegin','<span class="sm-tag">'+t('sm_best')+'</span>'); }
      }
      done++;
      $('#smFill').style.width=(done/list.length*100)+'%';
      $('#smSum').textContent=t('tb_testing',{a:done,b:list.length});
    };
  });
  await pool(tasks,4);
  if(my!==smRun) return;
  if(smBest){ $('#smSum').textContent=t('sm_best')+': «'+smBest.name+'» ('+smBest.ms+'ms)'; $('#smApply').disabled=false; }
  else $('#smSum').textContent=t('m_pfail');
}
click('#smAgain',runSmart);
click('#smApply',function(){
  if(!smBest) return;
  closeOv($('#ovSmart'));
  state.activeId=smBest.id;
  save(); renderList(); renderActiveBar(); renderMetrics(); renderActions();
  connect();
});

async function importSource(src,btn){
  if(btn){ btn.disabled=true; btn.innerHTML='<i data-lucide="loader-2"></i>…'; icons(); }
  log(t('m_fetch',{x:src.name}),'info');
  try{
    const res=await fetchSub(src.url);
    if(res.info){
      subMeta[src.tag]={url:src.url,up:res.info.up,down:res.info.down,total:res.info.total,expire:res.info.expire,updated:Date.now()};
      saveSubMeta();
    }
    const links=shuffle(extractLinks(res.text)).slice(0,150);
    const seen={};
    for(var i=0;i<state.configs.length;i++) seen[state.configs[i].raw]=1;
    let n=0;
    for(var j=0;j<links.length;j++){
      if(seen[links[j]]) continue;
      const p=parseLink(links[j]);
      if(p){ p.src=src.tag; if(addParsed(p)){ seen[links[j]]=1; n++; } }
    }
    if(n) afterAdd(n);
    else toast(t('m_nonew',{x:src.name}),'warn');
  }catch(e){
    toast(t('m_srcfail',{x:src.name}),'err');
  }
  if(btn){ btn.disabled=false; btn.innerHTML='<i data-lucide="download"></i>'+t('src_get'); icons(); }
  renderTabs();
}

function renderSubs(){
  const box=$('#subList');

  box.innerHTML=tags.map(function(g){
    const m=subMeta[g];
    let bar='',lines='';
    if(m&&(m.total||m.expire)){
      const used=(m.up||0)+(m.down||0);
      const pct=m.total?Math.min(100,Math.round(used/m.total*100)):0;
      const left=m.total?Math.max(0,m.total-used):0;
      const dl=daysLeft(m.expire);
      const col=pct>85?'var(--err)':pct>60?'var(--warn)':'var(--acc)';
      bar='<div class="qbar"><i style="width:'+pct+'%;background:'+col+'"></i></div>';
      lines='<div class="qrow"><span>'+t('sub_used')+'</span><b>'+fmtBytes(used)+(m.total?' / '+fmtBytes(m.total):'')+'</b></div>'+
        (m.total?'<div class="qrow"><span>'+t('sub_left')+'</span><b>'+fmtBytes(left)+'</b></div>':'')+
        '<div class="qrow"><span>'+t('sub_exp')+'</span><b>'+(m.expire?(dl!=null&&dl>=0?t('sub_days',{n:dl}):t('sub_expd')):t('sub_unk'))+'</b></div>';
    }else{
      lines='<p class="qnoinfo">'+esc(t('sub_noinfo'))+'</p>';
    }
    let cnt=0;
    for(var i=0;i<state.configs.length;i++) if(groupOf(state.configs[i])===g) cnt++;
    return '<div class="subcard"><div class="subhead"><b>'+esc(gLabel(g))+'</b><span class="cnt">'+cnt+' cfg</span></div>'+bar+lines+
      '<div class="subacts">'+
      '<button class="btn" data-supd="'+esc(g)+'"><i data-lucide="refresh-cw"></i>'+t('sub_upd')+'</button>'+
      '<button class="btn" data-sed="'+esc(g)+'"><i data-lucide="pencil"></i>'+t('sub_edit')+'</button>'+
      '<button class="btn danger" data-sdel="'+esc(g)+'"><i data-lucide="trash-2"></i>'+t('sub_del')+'</button>'+
      '</div></div>';
  }).join('');
  icons();
  box.querySelectorAll('[data-supd]').forEach(function(b){ b.onclick=function(){ updateGroup(b.getAttribute('data-supd')).then(renderSubs); }; });
  box.querySelectorAll('[data-sed]').forEach(function(b){ b.onclick=function(){ openSubEdit(b.getAttribute('data-sed')); }; });
  box.querySelectorAll('[data-sdel]').forEach(function(b){
    b.onclick=function(){
      const g=b.getAttribute('data-sdel');
      let n=0;
      for(var i=0;i<state.configs.length;i++) if(groupOf(state.configs[i])===g) n++;
      openConfirm(t('m_cdelg',{x:g,n:n}),function(){
        state.configs=state.configs.filter(function(c){ return groupOf(c)!==g; });
        if(state.tab===g) state.tab='all';
        delete subMeta[g]; saveSubMeta();
        save(); renderTabs(); renderList(); renderActiveBar(); renderSubs();
        toast(t('m_subdel'));
      });
    };
  });
}

function anyOverlayOpen(){
  return !!document.querySelector('.overlay.open, .drawer.open, .sheet.open');
}
function syncLock(){
  document.body.classList.toggle('locked', anyOverlayOpen());
}
function fitTallPanel(ov){
  if(!ov) return;
  const modal=ov.querySelector('.modal');
  if(!modal) return;
  const tallIds=['ovSettings','ovSources','ovSubs'];
  const isTall=tallIds.indexOf(ov.id)!==-1 || modal.classList.contains('tall-content');
  if(!isTall) return;
  const vv=window.visualViewport;
  const viewportH=Math.round((vv && vv.height) || document.documentElement.clientHeight || window.innerHeight || 0);
  if(viewportH<1) return;
  const gap=16;
  const panelH=Math.max(240,viewportH-gap);
  ov.style.padding='8px';
  ov.style.boxSizing='border-box';
  ov.style.overflowY='auto';
  modal.style.height=panelH+'px';
  modal.style.minHeight='0';
  modal.style.maxHeight=panelH+'px';
  modal.style.boxSizing='border-box';
  modal.style.overflow='hidden';
  const body=modal.querySelector('.m-body');
  if(body){
    body.style.flex='1 1 0%';
    body.style.minHeight='0';
    body.style.maxHeight='none';
    body.style.overflowY='auto';
    body.style.overflowX='hidden';
    body.style.webkitOverflowScrolling='touch';
  }
}
function openOv(id){
  const ov=$(id); if(!ov) return;
  ov.classList.add('open');
  fitTallPanel(ov);
  const mb=ov.querySelector('.m-body'); if(mb) mb.scrollTop=0;
  syncLock();
}
window.addEventListener('resize',function(){
  document.querySelectorAll('.overlay.open').forEach(fitTallPanel);
});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',function(){
    document.querySelectorAll('.overlay.open').forEach(fitTallPanel);
  });
}
function closeOv(el){
  if(!el) return;
  el.classList.remove('open');
  syncLock();
}
document.querySelectorAll('.overlay').forEach(function(ov){
  ov.addEventListener('click',function(e){
    if(e.target===ov){ closeOv(ov); if(ov.id==='ovScan') stopScan(); }
  });
});
function activateTab(btn){
  try{
    if(!btn) return;
    const modal=btn.closest('.modal'); if(!modal) return;
    const id=btn.getAttribute('data-tab'); if(!id) return;
    modal.querySelectorAll('.tabv').forEach(function(b){ b.classList.remove('on'); });
    modal.querySelectorAll('.tpane').forEach(function(p){ p.classList.remove('on'); });
    btn.classList.add('on');
    const pane=modal.querySelector('.tpane#'+id)||modal.querySelector('#'+id);
    if(pane) pane.classList.add('on');
    const mb=modal.querySelector('.m-body'); if(mb) mb.scrollTop=0;
  }catch(e){}
}
function bindTabs(){
  document.querySelectorAll('.tabv').forEach(function(b){
    if(b.__tabBound) return;
    b.__tabBound=true;
    b.addEventListener('click',function(e){ e.stopPropagation(); activateTab(b); });
  });
}
document.addEventListener('click',function(e){
  const b=(e.target&&e.target.closest)?e.target.closest('.tabv'):null;
  if(b) activateTab(b);
});
function switchTabV(modalEl,tabId){
  const modal=(typeof modalEl==='string')?$(modalEl):modalEl;
  if(!modal) return;
  const btn=modal.querySelector('.tabv[data-tab="'+tabId+'"]');
  if(btn){ activateTab(btn); return; }
  modal.querySelectorAll('.tabv').forEach(function(b){ b.classList.remove('on'); });
  modal.querySelectorAll('.tpane').forEach(function(p){ p.classList.remove('on'); });
  const pn=modal.querySelector('#'+tabId); if(pn) pn.classList.add('on');
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    closePops(); closeDrawer(); closeSheet();
    document.querySelectorAll('.overlay.open').forEach(function(ov){ closeOv(ov); });
    stopScan();
  }
});

/* پس‌زمینه */
(function(){
  const cv=$('#bg'),ctx=cv.getContext('2d');
  let W,H,dpr,dots=[],pulses=[];
  const mouse={x:-9999,y:-9999};
  function resize(){
    dpr=window.devicePixelRatio||1;
    W=window.innerWidth;H=window.innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;
    cv.style.width=W+'px';cv.style.height=H+'px';
    dots=[];
    const gap=W<640?78:64;
    for(let x=gap/2;x<W;x+=gap) for(let y=gap/2;y<H;y+=gap) dots.push({x:x,y:y,ph:Math.random()*6.28});
  }
  window.__bgPulse=function(x,y){ pulses.push({x:x*dpr,y:y*dpr,r:0,v:4.2*dpr,a:.9}); if(pulses.length>12) pulses.shift(); };
  window.addEventListener('mousemove',function(e){ mouse.x=e.clientX*dpr; mouse.y=e.clientY*dpr; });
  window.addEventListener('resize',resize);
  resize();
  function frame(tm){
    requestAnimationFrame(frame);
    if(!settings.ui.bg){ ctx.clearRect(0,0,cv.width,cv.height); return; }
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<pulses.length;i++){ pulses[i].r+=pulses[i].v; pulses[i].a*=.98; }
    pulses=pulses.filter(function(p){ return p.a>.03; });
    for(var d=0;d<dots.length;d++){
      const dot=dots[d];
      const wob=Math.sin(tm/1600+dot.ph)*1.5*dpr;
      const x=dot.x*dpr,y=dot.y*dpr+wob;
      const dx=x-mouse.x,dy=y-mouse.y;
      const near=Math.max(0,1-Math.sqrt(dx*dx+dy*dy)/(130*dpr));
      let a=.05+Math.sin(tm/900+dot.ph)*.02+near*.35;
      let r=(1.1+near)*dpr;
      let col='rgba(138,162,150,'+a.toFixed(3)+')';
      for(var p=0;p<pulses.length;p++){
        const px=x-pulses[p].x,py=y-pulses[p].y;
        const dp=Math.abs(Math.sqrt(px*px+py*py)-pulses[p].r);
        if(dp<30*dpr){ const b=(1-dp/(30*dpr))*pulses[p].a; a=Math.min(1,a+b*.9); r+=b*1.5*dpr; col='rgba(47,230,168,'+a.toFixed(3)+')'; }
      }
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=col; ctx.fill();
    }
  }
  requestAnimationFrame(frame);
})();
